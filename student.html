<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>高一下数学期末备考</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0e1a; --card: #141825; --border: #2a2f45;
            --text: #e8eaf0; --text-dim: #6b7280;
            --accent: #6366f1; --accent-light: #818cf8;
            --green: #10b981; --yellow: #f59e0b; --red: #ef4444;
            --sidebar-w: 220px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; -webkit-tap-highlight-color: transparent;
        }

        /* ===== LOGIN SCREEN ===== */
        .login-screen {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; min-height: 100vh; padding: 2rem;
        }
        .login-screen h1 {
            font-size: 1.8rem; margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--accent-light), var(--green));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .login-screen .subtitle { color: var(--text-dim); margin-bottom: 2rem; }
        .login-form {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 16px; padding: 2rem; width: 100%; max-width: 360px;
        }
        .login-form input, .login-form select {
            width: 100%; padding: 0.85rem 1rem; border: 1px solid var(--border);
            border-radius: 10px; background: var(--bg); color: var(--text);
            font-size: 1rem; margin-bottom: 0.75rem;
        }
        .login-form input:focus, .login-form select:focus {
            outline: none; border-color: var(--accent);
        }
        .login-form button {
            width: 100%; padding: 0.85rem; background: var(--accent); color: white;
            border: none; border-radius: 10px; font-size: 1rem; font-weight: 600;
            cursor: pointer; margin-top: 0.5rem;
        }
        .login-form button:active { opacity: 0.85; }
        .login-form .error {
            color: var(--red); font-size: 0.85rem; margin-top: 0.5rem; display: none;
        }
        .login-form label {
            display: block; font-size: 0.85rem; color: var(--text-dim);
            margin-bottom: 0.3rem; margin-top: 0.25rem;
        }

        /* ===== PASSWORD CHANGE SCREEN ===== */
        .pwd-change-screen {
            display: none; flex-direction: column; align-items: center;
            justify-content: center; min-height: 100vh; padding: 2rem;
        }
        .pwd-change-screen h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: var(--yellow); }
        .pwd-change-screen .subtitle { color: var(--text-dim); margin-bottom: 2rem; }

        /* ===== SIDEBAR ===== */
        .sidebar {
            position: fixed; left: 0; top: 0; bottom: 0; width: var(--sidebar-w);
            background: var(--card); border-right: 1px solid var(--border);
            z-index: 200; display: none; flex-direction: column;
            overflow-y: auto; padding-top: 60px;
        }
        .sidebar.open { display: flex; }
        .sidebar-item {
            padding: 0.75rem 1.25rem; font-size: 0.88rem; color: var(--text-dim);
            cursor: pointer; border-left: 3px solid transparent;
            transition: all 0.15s; white-space: nowrap; text-decoration: none;
        }
        .sidebar-item:hover, .sidebar-item.active {
            color: var(--text); background: rgba(99,102,241,0.08);
            border-left-color: var(--accent);
        }
        .sidebar-item.section-label {
            font-size: 0.75rem; color: var(--text-dim); opacity: 0.6;
            padding: 0.6rem 1.25rem 0.3rem; text-transform: uppercase;
            pointer-events: none;
        }
        .sidebar-close {
            position: absolute; top: 12px; right: 12px; background: none;
            border: none; color: var(--text-dim); font-size: 1.3rem; cursor: pointer;
            display: none;
        }

        /* ===== MAIN APP ===== */
        .app { display: none; }
        .header {
            background: var(--card); border-bottom: 1px solid var(--border);
            padding: 0.85rem 1.25rem; display: flex; align-items: center;
            justify-content: space-between; position: sticky; top: 0; z-index: 150;
        }
        .header-left { display: flex; align-items: center; gap: 0.75rem; }
        .hamburger {
            background: none; border: none; color: var(--text); font-size: 1.4rem;
            cursor: pointer; padding: 4px 8px; display: none;
        }
        .header h1 { font-size: 1.1rem; }
        .header-right { display: flex; align-items: center; gap: 0.75rem; }
        .profile-badge {
            background: var(--accent); color: white; padding: 0.35rem 0.7rem;
            border-radius: 6px; font-size: 0.8rem;
        }
        .sync-status { font-size: 0.7rem; color: var(--green); }
        .sync-status.offline { color: var(--red); }

        .main-wrapper { display: flex; }
        .container {
            max-width: 800px; margin: 0 auto; padding: 1rem 1.25rem 6rem;
            flex: 1; min-width: 0;
        }

        /* Desktop: sidebar always visible */
        @media (min-width: 1025px) {
            .sidebar { display: flex; }
            .sidebar .sidebar-close { display: none !important; }
            .app .header { margin-left: var(--sidebar-w); }
            .main-wrapper { margin-left: var(--sidebar-w); }
            .hamburger { display: none !important; }
        }
        /* Tablet/Mobile: sidebar as drawer */
        @media (max-width: 1024px) {
            .sidebar { display: none; }
            .sidebar.open { display: flex; }
            .sidebar .sidebar-close { display: block; }
            .hamburger { display: block; }
            .sidebar-overlay {
                display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
                background: rgba(0,0,0,0.5); z-index: 199;
            }
            .sidebar-overlay.open { display: block; }
        }

        /* Score card */
        .score-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem;
        }
        .score-card h3 { font-size: 1rem; margin-bottom: 0.75rem; }
        .score-period { margin-bottom: 0.75rem; }
        .score-period-title {
            font-size: 0.85rem; color: var(--accent-light); font-weight: 600;
            margin-bottom: 0.4rem; padding-bottom: 0.3rem;
            border-bottom: 1px solid rgba(99,102,241,0.2);
        }
        .score-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.3rem 0; font-size: 0.9rem;
        }
        .score-label { color: var(--text-dim); }
        .score-value { font-weight: 600; }
        .score-rank {
            font-size: 0.8rem; color: var(--text-dim);
            background: rgba(99,102,241,0.1); padding: 0.15rem 0.5rem;
            border-radius: 4px; margin-left: 0.5rem;
        }
        .score-absent { color: var(--red); font-style: italic; }

        /* Target section */
        .target-section {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem;
        }
        .target-section h3 { font-size: 1rem; margin-bottom: 0.75rem; }
        .target-row {
            display: flex; gap: 0.75rem; align-items: center; margin-bottom: 0.6rem;
        }
        .target-row label {
            font-size: 0.85rem; color: var(--text-dim); min-width: 120px; flex-shrink: 0;
        }
        .target-row input {
            flex: 1; padding: 0.5rem 0.75rem; border: 1px solid var(--border);
            border-radius: 8px; background: var(--bg); color: var(--text); font-size: 0.9rem;
        }
        .target-row input:focus { outline: none; border-color: var(--accent); }
        .target-row span { font-size: 0.85rem; color: var(--text-dim); flex-shrink: 0; }
        .target-save-btn {
            padding: 0.5rem 1.25rem; background: var(--accent); color: white;
            border: none; border-radius: 8px; font-size: 0.85rem; cursor: pointer; margin-top: 0.5rem;
        }
        .target-save-btn:active { opacity: 0.8; }

        /* Overall progress */
        .overall-progress {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem;
        }
        .overall-progress h3 { font-size: 1rem; margin-bottom: 0.75rem; }
        .progress-stats { display: flex; gap: 1.5rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
        .progress-stat { text-align: center; }
        .progress-stat .num { font-size: 1.5rem; font-weight: 700; }
        .progress-stat .label { font-size: 0.75rem; color: var(--text-dim); }
        .progress-bar-outer {
            height: 8px; background: var(--border); border-radius: 4px; overflow: hidden;
        }
        .progress-bar-inner {
            height: 100%; border-radius: 4px; transition: width 0.5s ease;
        }

        /* Score Prediction */
        .prediction-section {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem;
        }
        .prediction-section h3 { font-size: 1rem; margin-bottom: 0.75rem; }
        .prediction-total {
            font-size: 1.6rem; font-weight: 700; color: var(--accent-light);
            margin-bottom: 0.75rem; text-align: center;
        }
        .prediction-breakdown { display: flex; flex-direction: column; gap: 0.4rem; }
        .pred-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.4rem 0.75rem; border-radius: 6px;
            background: rgba(255,255,255,0.02); font-size: 0.85rem;
        }
        .pred-row .pred-mod { color: var(--text); font-weight: 500; }
        .pred-row .pred-pts { font-weight: 600; color: var(--accent-light); }
        .pred-row .pred-detail { font-size: 0.75rem; color: var(--text-dim); }

        /* Radar */
        .radar-section {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; text-align: center;
        }
        .radar-section h3 { font-size: 1rem; margin-bottom: 0.75rem; }
        .radar-canvas { max-width: 100%; }

        /* Calendar */
        .calendar-section {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem;
        }
        .calendar-section h3 { font-size: 1rem; margin-bottom: 0.5rem; }
        .countdown-banner {
            text-align: center; font-size: 1.15rem; font-weight: 600;
            color: var(--yellow); padding: 0.75rem; margin-bottom: 0.75rem;
            background: rgba(245,158,11,0.08); border-radius: 8px;
        }
        .cal-grid {
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
        }
        .cal-header-cell {
            text-align: center; font-size: 0.75rem; color: var(--text-dim);
            padding: 0.3rem 0; font-weight: 600;
        }
        .cal-cell {
            background: var(--bg); border: 1px solid var(--border);
            border-radius: 6px; padding: 0.35rem; min-height: 56px;
            font-size: 0.75rem; cursor: pointer; position: relative;
            transition: all 0.15s;
        }
        .cal-cell:hover { border-color: var(--accent); }
        .cal-cell .cal-day { font-weight: 600; margin-bottom: 2px; }
        .cal-cell .cal-plan {
            font-size: 0.65rem; color: var(--text-dim); overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap;
        }
        .cal-cell.today { border: 2px solid var(--accent); background: rgba(99,102,241,0.12); box-shadow: 0 0 8px rgba(99,102,241,0.3); }
        .cal-cell.past { }
        .cal-cell.past .cal-day { opacity: 0.5; }
        .cal-cell.exam-day {
            border-color: var(--red); background: rgba(239,68,68,0.12);
        }
        .cal-cell.exam-day .cal-day { color: var(--red); }
        .cal-cell .cal-plan-item {
            display: flex; align-items: flex-start; gap: 3px;
            font-size: 0.65rem; color: var(--text-dim); line-height: 1.3;
        }
        .cal-cell .cal-plan-item input[type="checkbox"] {
            width: 12px; height: 12px; margin-top: 1px; cursor: pointer;
            flex-shrink: 0; accent-color: var(--green);
        }
        .cal-cell .cal-plan-item.checked .plan-text {
            text-decoration: line-through; color: var(--text-dim); opacity: 0.5;
        }
        .cal-cell .plan-text {
            overflow: hidden; text-overflow: ellipsis;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        }
        .cal-empty { background: transparent; border: none; cursor: default; }

        /* Sort toggle */
        .sort-toggle-btn {
            background: none; border: 1px solid var(--border);
            border-radius: 6px; color: var(--text-dim); font-size: 0.72rem;
            padding: 0.2rem 0.55rem; cursor: pointer; margin: 0.5rem 1.25rem 0;
            transition: all 0.15s;
        }
        .sort-toggle-btn:hover { border-color: var(--accent); color: var(--accent-light); }
        .sort-toggle-btn.active { border-color: var(--accent); color: var(--accent-light); background: rgba(99,102,241,0.08); }

        /* Calendar plan modal */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); z-index: 300;
            justify-content: center; align-items: center; padding: 1rem;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 14px; padding: 1.5rem; width: 100%; max-width: 400px;
        }
        .modal-box h3 { font-size: 1rem; margin-bottom: 0.75rem; }
        .modal-box textarea {
            width: 100%; padding: 0.75rem; border: 1px solid var(--border);
            border-radius: 8px; background: var(--bg); color: var(--text);
            font-size: 0.9rem; resize: vertical; min-height: 80px;
            font-family: inherit; margin-bottom: 0.75rem;
        }
        .modal-box textarea:focus { outline: none; border-color: var(--accent); }
        .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; }
        .modal-actions button {
            padding: 0.5rem 1rem; border: none; border-radius: 8px;
            font-size: 0.85rem; cursor: pointer;
        }
        .modal-save { background: var(--accent); color: white; }
        .modal-cancel { background: var(--border); color: var(--text); }

        /* Calendar task list (multi-task modal) */
        .cal-task-list { max-height: 300px; overflow-y: auto; margin-bottom: 0.75rem; }
        .cal-task-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0; border-bottom: 1px solid rgba(42,47,69,0.4); }
        .cal-task-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--green); cursor: pointer; flex-shrink: 0; }
        .cal-task-item input[type="text"] { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 0.4rem 0.6rem; color: var(--text); font-size: 0.85rem; font-family: inherit; }
        .cal-task-item input[type="text"]:focus { outline: none; border-color: var(--accent); }
        .cal-task-item.done input[type="text"] { text-decoration: line-through; opacity: 0.5; }
        .cal-task-remove { background: none; border: none; color: var(--red); font-size: 1.1rem; cursor: pointer; padding: 0 0.3rem; opacity: 0.6; }
        .cal-task-remove:hover { opacity: 1; }
        .cal-task-add-row { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
        .cal-new-task-input { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem 0.75rem; color: var(--text); font-size: 0.85rem; font-family: inherit; }
        .cal-new-task-input:focus { outline: none; border-color: var(--accent); }
        .cal-add-task-btn { background: var(--accent); color: white; border: none; border-radius: 8px; width: 36px; height: 36px; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .cal-add-task-btn:active { opacity: 0.8; }

        /* Module cards */
        .module-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; margin-bottom: 0.75rem; overflow: hidden;
        }
        .module-header {
            padding: 1rem 1.25rem; display: flex; align-items: center;
            justify-content: space-between; cursor: pointer;
            -webkit-user-select: none; user-select: none;
        }
        .module-header:active { background: rgba(255,255,255,0.02); }
        .module-name { font-size: 1rem; font-weight: 600; }
        .module-meta { display: flex; align-items: center; gap: 0.5rem; }
        .module-dots { display: flex; gap: 3px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; }
        .dot.g { background: var(--green); }
        .dot.y { background: var(--yellow); }
        .dot.r { background: var(--red); }
        .module-pct { font-size: 0.8rem; color: var(--text-dim); min-width: 36px; text-align: right; }
        .expand-icon {
            color: var(--text-dim); transition: transform 0.3s; font-size: 0.8rem;
        }
        .module-card.expanded .expand-icon { transform: rotate(180deg); }
        .module-body { display: none; border-top: 1px solid var(--border); }
        .module-card.expanded .module-body { display: block; }

        .point-item {
            padding: 0.85rem 1.25rem;
            border-bottom: 1px solid rgba(42,47,69,0.6);
        }
        .point-item:last-child { border-bottom: none; }
        .point-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 0.5rem; flex-wrap: wrap; gap: 0.4rem;
        }
        .point-name { font-size: 0.9rem; flex: 1; min-width: 120px; }
        .point-weight {
            font-size: 0.7rem; padding: 0.15rem 0.4rem; border-radius: 4px;
            margin-right: 0.5rem; flex-shrink: 0;
        }
        .weight-high { background: rgba(239,68,68,0.15); color: var(--red); }
        .weight-mid { background: rgba(245,158,11,0.15); color: var(--yellow); }
        .weight-low { background: rgba(16,185,129,0.15); color: var(--green); }
        .custom-badge {
            font-size: 0.65rem; padding: 0.1rem 0.35rem; border-radius: 3px;
            background: rgba(99,102,241,0.15); color: var(--accent-light);
            margin-right: 0.3rem; flex-shrink: 0;
        }

        .btn-group { display: flex; gap: 4px; }
        .status-btn {
            min-width: 70px; height: 36px; border: 2px solid var(--border);
            border-radius: 8px; background: transparent; color: var(--text-dim);
            font-size: 0.78rem; cursor: pointer; display: flex; align-items: center;
            justify-content: center; transition: all 0.15s; padding: 0 6px;
            -webkit-tap-highlight-color: transparent; white-space: nowrap;
        }
        .status-btn:active { transform: scale(0.95); }
        .status-btn.active-g {
            border-color: var(--green); background: rgba(16,185,129,0.18); color: var(--green);
            font-weight: 600;
        }
        .status-btn.active-y {
            border-color: var(--yellow); background: rgba(245,158,11,0.18); color: var(--yellow);
            font-weight: 600;
        }
        .status-btn.active-r {
            border-color: var(--red); background: rgba(239,68,68,0.18); color: var(--red);
            font-weight: 600;
        }

        .point-note {
            width: 100%; padding: 0.65rem 0.75rem; border: 1px solid var(--border);
            border-radius: 8px; background: var(--bg); color: var(--text);
            font-size: 0.85rem; resize: none; min-height: 50px; margin-top: 0.4rem;
            font-family: inherit;
        }
        .point-note:focus { outline: none; border-color: var(--accent); }
        .point-note::placeholder { color: var(--text-dim); }
        .note-actions { display: flex; gap: 0.5rem; margin-top: 0.4rem; }
        .share-tip-btn {
            padding: 0.3rem 0.65rem; border: 1px solid var(--accent);
            border-radius: 6px; background: transparent; color: var(--accent-light);
            font-size: 0.75rem; cursor: pointer;
        }
        .share-tip-btn:hover { background: rgba(99,102,241,0.1); }

        /* Add custom point */
        .add-custom-point {
            padding: 0.75rem 1.25rem; display: flex; gap: 0.5rem; align-items: center;
            border-top: 1px solid var(--border);
        }
        .add-custom-point input {
            flex: 1; padding: 0.5rem 0.75rem; border: 1px solid var(--border);
            border-radius: 8px; background: var(--bg); color: var(--text);
            font-size: 0.85rem;
        }
        .add-custom-point input:focus { outline: none; border-color: var(--accent); }
        .add-custom-point button {
            padding: 0.5rem 0.85rem; background: var(--accent); color: white;
            border: none; border-radius: 8px; font-size: 0.8rem; cursor: pointer;
            white-space: nowrap;
        }

        /* Tips Forum */
        .tips-section {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem;
        }
        .tips-section h3 { font-size: 1rem; margin-bottom: 0.75rem; }
        .tips-list { display: flex; flex-direction: column; gap: 0.6rem; }
        .tip-card {
            background: var(--bg); border: 1px solid var(--border);
            border-radius: 10px; padding: 0.85rem 1rem;
        }
        .tip-meta {
            font-size: 0.78rem; color: var(--accent-light); margin-bottom: 0.4rem;
            font-weight: 500;
        }
        .tip-content { font-size: 0.88rem; line-height: 1.5; margin-bottom: 0.5rem; }
        .tip-actions { display: flex; gap: 0.75rem; align-items: center; }
        .tip-like-btn {
            display: flex; align-items: center; gap: 0.3rem;
            background: none; border: 1px solid var(--border); border-radius: 6px;
            color: var(--text-dim); font-size: 0.78rem; padding: 0.25rem 0.55rem;
            cursor: pointer;
        }
        .tip-like-btn:hover { border-color: var(--yellow); color: var(--yellow); }
        .tip-like-btn.liked { border-color: var(--yellow); color: var(--yellow); }
        .tip-add-note-btn {
            background: none; border: 1px solid var(--border); border-radius: 6px;
            color: var(--text-dim); font-size: 0.78rem; padding: 0.25rem 0.55rem;
            cursor: pointer;
        }
        .tip-add-note-btn:hover { border-color: var(--green); color: var(--green); }

        /* Actions */
        .actions { display: flex; gap: 0.75rem; margin: 1.5rem 0; }
        .action-btn {
            flex: 1; padding: 0.85rem; border: 1px solid var(--border);
            border-radius: 10px; background: var(--card); color: var(--text);
            font-size: 0.9rem; cursor: pointer; text-align: center;
        }
        .action-btn.primary {
            background: var(--accent); border-color: var(--accent); color: white;
        }

        // ============================================================

        // ============================================================
        async function doLogin() {
            var cls = $('loginClass').value.trim();
            var name = $('loginName').value.trim();
            var pin = $('loginPin').value.trim() || '1234';
            var errEl = $('loginError');
            errEl.style.display = 'none';

            if (!cls || !name) {
                errEl.textContent = '请填写班级和姓名';
                errEl.style.display = 'block';
                return;
            }
            if (!STUDENT_NAMES.includes(name)) {
                errEl.textContent = '该姓名不在班级名单中';
                errEl.style.display = 'block';
                return;
            }

            try {
                // Look up by name only — students were pre-imported, names are unique
                var { data: existing, error: lookupErr } = await sb.from('students')
                    .select('id, class_name, name, pin')
                    .eq('name', name)
                    .limit(1)
                    .maybeSingle();

                if (lookupErr) throw lookupErr;

                if (existing) {
                    if (existing.pin !== pin) {
                        errEl.textContent = '密码不正确';
                        errEl.style.display = 'block';
                        return;
                    }
                    currentUser = existing;

                    // Check first-login status (try DB column, fall back to localStorage)
                    var needsChange = false;
                    try {
                        var { data: flData } = await sb.from('students')
                            .select('first_login_done')
                            .eq('id', existing.id)
                            .single();
                        if (flData && flData.first_login_done === false) {
                            needsChange = true;
                        } else if (!flData || flData.first_login_done == null) {
                            needsChange = !localStorage.getItem('fl_' + existing.id);
                        }
                    } catch (_) {
                        // Column may not exist — fall back to localStorage
                        needsChange = !localStorage.getItem('fl_' + existing.id);
                    }

                    if (needsChange) {
                        showPasswordChangeScreen();
                        return;
                    }
                    await enterApp();
                } else {
                    // Student not in DB — should not happen since we pre-imported all 45
                    errEl.textContent = '未找到您的记录，请确认姓名是否正确';
                    errEl.style.display = 'block';
                }
            } catch (e) {
                errEl.textContent = '连接失败: ' + e.message;
                errEl.style.display = 'block';
            }
        }

        async function doChangePin() {
            var newPin = $('newPin').value.trim();

            var errEl = $('pwdChangeError');
            errEl.style.display = 'none';

            if (newPin.length < 4) {

            }
            if (newPin !== confirm) {
                errEl.textContent = '两次输入的密码不一致';

            }

            try {

                } catch (_) {

        // ============================================================

        // ============================================================
        function sortPoints(points, moduleKey, sortMode) {
            if (sortMode === 'kb') return points.slice();
            var notMastered = [];
            var partial = [];
            var mastered = [];
            var unassessed = [];

            points.forEach(function(p) {
                var a = assessments[p.id];
                if (!a || !a.status) { unassessed.push(p); }
                else if (a.status === 'not_mastered') { notMastered.push(p); }
                else if (a.status === 'partial') { partial.push(p); }
                else if (a.status === 'mastered') { mastered.push(p); }
                else { unassessed.push(p); }
            });

            return notMastered.concat(unassessed).concat(partial).concat(mastered);
        }

            custom.forEach(function(cp) {

        // ============================================================
        // QUIZ-BASED SUGGESTIONS
        // ============================================================
        function computeQuizSuggestions() {
            if (!currentUser) return {};

            var suggestions = {}; // { pointId: { correct: N, wrong: N, total: N } }

            // Build point -> question results mapping across all quizzes
            ALL_QUIZZES.forEach(function(quiz) {
                var studentScores = quiz.scores[currentUser.name];
                if (!studentScores) return;

                quiz.questions.forEach(function(q) {
                    var qResult = studentScores.questions.find(function(sq) { return sq.q === q.q; });
                    if (!qResult) return;
                    var isCorrect = qResult.score === 5;

                    q.points.forEach(function(pid) {
                        if (!suggestions[pid]) {
                            suggestions[pid] = { correct: 0, wrong: 0, total: 0 };
                        }
                        suggestions[pid].total++;
                        if (isCorrect) {
                            suggestions[pid].correct++;
                        } else {
                            suggestions[pid].wrong++;
                        }
                    });
                });
            });

            // Apply rules
            Object.keys(suggestions).forEach(function(pid) {
                var s = suggestions[pid];
                if (s.wrong >= 2) {
                    s.status = 'not_mastered';
                } else if (s.correct >= 3) {
                    s.status = 'mastered';
                } else if (s.correct >= 1) {
                    s.status = 'partial';
                } else {
                    s.status = 'not_mastered';
                }
            });

            return suggestions;
        }

            });
            container.innerHTML = '';

            // Compute quiz-based suggestions
            var quizSuggestions = computeQuizSuggestions();
            // Filter out dismissed ones
            Object.keys(dismissedSuggestions).forEach(function(pid) {
                delete quizSuggestions[pid];
            });
            // Also filter out points where student already has a self-assessment
            Object.keys(quizSuggestions).forEach(function(pid) {
                if (assessments[pid] && assessments[pid].status) {
                    delete quizSuggestions[pid]; // Student already assessed this
                }
            });

            Object.entries(KB).forEach(function(entry) {
                var key = entry[0];
                var mod = entry[1];
                var allPoints = getAllPoints(key);
                var sortMode = moduleSortModes[key] || 'mastery';
                var sortedPoints = sortPoints(allPoints, key, sortMode);
                var stats = getModuleStats(key);
                var total = allPoints.length;
                var pct = total > 0 ? Math.round(((stats.g + stats.y * 0.5) / total) * 100) : 0;

                var pointsHtml = sortedPoints.map(function(p) {
                    var a = assessments[p.id] || {};
                    var weightLabel = p.w === 'high' ? '高频' : p.w === 'mid' ? '中频' : '低频';

                    var yActive = a.status === 'partial' ? ' active-y' : '';
                    var rActive = a.status === 'not_mastered' ? ' active-r' : '';

                            '</div>' +
                        '</div>';

                    // Quiz suggestion for this point (only if not yet self-assessed and not dismissed)
                    var quizSugg = quizSuggestions[p.id];
                    if (quizSugg) {
                        var suggText = quizSugg.status === 'mastered' ? '满分拿下' : quizSugg.status === 'partial' ? '加强练习' : '有点挑战';
                        var suggColor = quizSugg.status === 'mastered' ? 'var(--green)' : quizSugg.status === 'partial' ? 'var(--yellow)' : 'var(--red)';
                        var suggRgb = quizSugg.status === 'mastered' ? '16,185,129' : quizSugg.status === 'partial' ? '245,158,11' : '239,68,68';
                        pointHtml += '<div class="quiz-sugg" style="margin-top:0.4rem;font-size:0.72rem;color:' + suggColor + ';display:flex;align-items:center;gap:0.3rem;padding:0 0 0.4rem 0;">' +

        function getModuleStats(key) {
            var g = 0, y = 0, r = 0;
            var allPoints = getAllPoints(key);
            allPoints.forEach(function(p) {
                var a = assessments[p.id];
                if (a) {
                    if (a.status === 'mastered') g++;
                    else if (a.status === 'partial') y++;
                    else r++;
                }
            });
            return { g: g, y: y, r: r };
        }

        // ============================================================
        // OVERALL PROGRESS
        // ============================================================
        function renderStats() {
            var g = 0, y = 0, r = 0, total = 0;
            Object.keys(KB).forEach(function(key) {
                var allPts = getAllPoints(key);
                total += allPts.length;
                allPts.forEach(function(p) {
                    var a = assessments[p.id];
                    if (a) {
                        if (a.status === 'mastered') g++;
                        else if (a.status === 'partial') y++;
                        else if (a.status === 'not_mastered') r++;
                    }
                });
            });
            $('statMastered').textContent = g;
            $('statPartial').textContent = y;
            $('statNot').textContent = r;
            $('statUnset').textContent = total - g - y - r;
            var pct = total > 0 ? Math.round(((g + y * 0.5) / total) * 100) : 0;
            $('overallBar').style.width = pct + '%';
        }

        // ============================================================
        // SCORE PREDICTION
        // ============================================================
        function renderPrediction() {
            var totalPred = 0;
            var breakdownHtml = '';

            Object.entries(KB).forEach(function(entry) {
                var key = entry[0];
                var mod = entry[1];
                var weight = MODULE_WEIGHTS[key];
                var allPts = getAllPoints(key);
                var modTotal = allPts.length;

                var modScore = 0;
                allPts.forEach(function(p) {
                    var a = assessments[p.id];
                    var perPoint = weight.pts / modTotal;
                    if (!a || !a.status) {
                        modScore += perPoint * 0.5; // unassessed = 50%
                    } else if (a.status === 'mastered') {
                        modScore += perPoint * 1.0;
                    } else if (a.status === 'partial') {
                        modScore += perPoint * 0.6;
                    } else if (a.status === 'not_mastered') {
                        modScore += perPoint * 0.25;
                    }
                });

                totalPred += modScore;

                var statusSummary = getModuleStats(key);
                breakdownHtml += '<div class="pred-row">' +
                    '<span class="pred-mod">' + key + '. ' + mod.name + '</span>' +
                    '<span class="pred-detail">' + statusSummary.g + '/' + modTotal + ' 掌握</span>' +
                    '<span class="pred-pts">' + modScore.toFixed(1) + '/' + weight.pts + '</span>' +
                '</div>';
            });

            $('predTotal').textContent = '根据你的自评，预测期末数学得分：约 ' + Math.round(totalPred) + '/150 分';
            $('predBreakdown').innerHTML = breakdownHtml;
        }

        // ============================================================
        // RADAR CHART
        // ============================================================
        function drawRadar() {
            var canvas = $('radarCanvas');
            var ctx = canvas.getContext('2d');
            var dpr = window.devicePixelRatio || 1;
            var size = 320;
            canvas.width = size * dpr;
            canvas.height = size * dpr;
            canvas.style.width = size + 'px';
            canvas.style.height = size + 'px';
            ctx.scale(dpr, dpr);

            var w = size, h = size;
            var cx = w / 2, cy = h / 2;
            var r = Math.min(w, h) / 2 - 50;
            ctx.clearRect(0, 0, w, h);

            var modules = Object.entries(KB);
            var n = modules.length;
            var step = (Math.PI * 2) / n;

            ctx.strokeStyle = '#2a2f45';
            ctx.lineWidth = 1;
            for (var i = 1; i <= 4; i++) {
                ctx.beginPath();
                for (var j = 0; j <= n; j++) {
                    var a = j * step - Math.PI / 2;
                    var x = cx + Math.cos(a) * r * i / 4;
                    var y = cy + Math.sin(a) * r * i / 4;
                    if (j === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }

            modules.forEach(function(_, idx) {
                var a = idx * step - Math.PI / 2;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
                ctx.stroke();
            });

            var rates = modules.map(function(entry) {
                var key = entry[0];
                var allPts = getAllPoints(key);
                var m = 0, total = allPts.length;
                allPts.forEach(function(p) {
                    var a = assessments[p.id];
                    if (a && a.status === 'mastered') m++;
                    else if (a && a.status === 'partial') m += 0.5;
                });
                return total > 0 ? m / total : 0;
            });

            ctx.fillStyle = 'rgba(99,102,241,0.25)';
            ctx.strokeStyle = '#6366f1';
            ctx.lineWidth = 2;
            ctx.beginPath();
            rates.forEach(function(rate, idx) {
                var a = idx * step - Math.PI / 2;
                var x = cx + Math.cos(a) * r * rate;
                var y = cy + Math.sin(a) * r * rate;
                if (idx === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#6366f1';
            rates.forEach(function(rate, idx) {
                var a = idx * step - Math.PI / 2;
                var x = cx + Math.cos(a) * r * rate;
                var y = cy + Math.sin(a) * r * rate;
                ctx.beginPath();
                ctx.arc(x, y, 3, 0, Math.PI * 2);
                ctx.fill();
            });

            modules.forEach(function(entry, idx) {
                var key = entry[0], mod = entry[1];
                var a = idx * step - Math.PI / 2;
                var lx = cx + Math.cos(a) * (r + 28);
                var ly = cy + Math.sin(a) * (r + 28);
                ctx.fillStyle = '#e8eaf0';
                ctx.font = 'bold 11px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(mod.name, lx, ly);
                ctx.font = '10px sans-serif';
                ctx.fillStyle = '#6b7280';
                ctx.fillText(Math.round(rates[idx] * 100) + '%', lx, ly + 14);
            });
        }

        // ============================================================
        // CALENDAR
        // ============================================================
        function renderCalendar() {
            var examDate = new Date(2026, 6, 8); // July 8, 2026 (month is 0-indexed)
            var today = new Date();
            today.setHours(0, 0, 0, 0);

            // Countdown
            var diffMs = examDate.getTime() - today.getTime();
            var diffDays = Math.ceil(diffMs / (1000 * 60 * 60 * 24));
            if (diffDays < 0) diffDays = 0;
            $('countdownBanner').textContent = '距离期末考试还有 ' + diffDays + ' 天';

            // Calendar from June 11 to July 8
            var startDate = new Date(2026, 5, 11); // June 11
            var endDate = new Date(2026, 6, 8);    // July 8

            var grid = $('calGrid');
            grid.innerHTML = '';

            // Day headers
            var dayNames = ['日', '一', '二', '三', '四', '五', '六'];
            dayNames.forEach(function(d) {
                var cell = document.createElement('div');
                cell.className = 'cal-header-cell';
                cell.textContent = d;
                grid.appendChild(cell);
            });

            // Leading empty cells
            var startDay = startDate.getDay(); // 0=Sun
            for (var i = 0; i < startDay; i++) {
                var empty = document.createElement('div');
                empty.className = 'cal-cell cal-empty';
                grid.appendChild(empty);
            }

            // Date cells
            var current = new Date(startDate);
            while (current <= endDate) {
                var dateStr = formatDate(current);
                var isToday = current.getTime() === today.getTime();
                var isPast = current.getTime() < today.getTime();
                var isExam = current.getTime() === examDate.getTime();

                var cell = document.createElement('div');
                cell.className = 'cal-cell';
                if (isToday) cell.classList.add('today');
                if (isPast && !isToday) cell.classList.add('past');
                if (isExam) cell.classList.add('exam-day');

                var dayNum = current.getDate();
                var monthLabel = (current.getMonth() + 1) + '/';
                var planText = reviewPlans[dateStr] || '';
                var planDisplay = '';
                if (planText) {
                    var tasks = parsePlanContent(planText);
                    planDisplay = tasks.map(function(task, idx) {
                        var itemKey = dateStr + '_' + idx;
                        var checkedClass = task.done ? ' checked' : '';
                        var checkedAttr = task.done ? ' checked' : '';
                        return '<label class="cal-plan-item' + checkedClass + '">' +
                            '<input type="checkbox"' + checkedAttr + ' data-plan-check="' + itemKey + '" data-date="' + dateStr + '" data-idx="' + idx + '">' +
                            '<span class="plan-text">' + escapeHtml(task.text) + '</span>' +
                        '</label>';
                    }).join('');
                }

                cell.innerHTML = '<div class="cal-day">' + monthLabel + dayNum +
                    (isExam ? ' 考试!' : '') + '</div>' +
                    '<div class="cal-plan">' + planDisplay + '</div>';
                cell.setAttribute('data-date', dateStr);
                cell.addEventListener('click', function() {
                    openCalModal(this.getAttribute('data-date'));
                });

                grid.appendChild(cell);
                current.setDate(current.getDate() + 1);
            }

            // Attach checkbox handlers for plan check items (per-task)
            grid.querySelectorAll('.cal-plan-item input[type="checkbox"]').forEach(function(cb) {
                cb.addEventListener('click', function(e) {
                    e.stopPropagation();
                    var dateKey = cb.getAttribute('data-date');
                    var taskIdx = parseInt(cb.getAttribute('data-idx'));
                    var label = cb.closest('.cal-plan-item');
                    if (cb.checked) {
                        label.classList.add('checked');
                    } else {
                        label.classList.remove('checked');
                    }
                    // Update the task in reviewPlans
                    var tasks = parsePlanContent(reviewPlans[dateKey] || '');
                    if (tasks[taskIdx]) {
                        tasks[taskIdx].done = cb.checked;
                        reviewPlans[dateKey] = JSON.stringify(tasks);
                        // Save to server
                        if (currentUser) {
                            sb.from('review_plans').upsert({
                                student_id: currentUser.id,
                                plan_date: dateKey,
                                content: reviewPlans[dateKey]
                            }, { onConflict: 'student_id,plan_date' }).catch(function(){});
                        }
                    }
                });
            });
        }

        function formatDate(d) {
            var y = d.getFullYear();
            var m = String(d.getMonth() + 1).padStart(2, '0');
            var day = String(d.getDate()).padStart(2, '0');
            return y + '-' + m + '-' + day;
        }

        // ============================================================
        // STATUS & NOTE OPERATIONS
        // ============================================================
        async function setStatus(pointId, status, btnEl) {
            if (!currentUser) return;

            if (!assessments[pointId]) assessments[pointId] = {};
            var prevStatus = assessments[pointId].status;
            assessments[pointId].status = status;

            var btns = btnEl.parentElement.querySelectorAll('.status-btn');
            btns.forEach(function(b) { b.className = 'status-btn'; });
            var cls = status === 'mastered' ? 'active-g' : status === 'partial' ? 'active-y' : 'active-r';
            btnEl.className = 'status-btn ' + cls;

            try {
                await sb.from('self_assessments').upsert({
                    student_id: currentUser.id,
                    point_id: pointId,
                    status: status,
                    note: assessments[pointId].note || ''
                }, { onConflict: 'student_id,point_id' });
                updateSyncStatus(true);
            } catch (e) {
                updateSyncStatus(false);
            }

            // If status category changed, re-render modules to re-sort
            var prevCategory = getCategory(prevStatus);
            var newCategory = getCategory(status);
            if (prevCategory !== newCategory) {
                renderModules();
                rebindModuleListeners();
            }

            renderStats();
            drawRadar();
            renderPrediction();
            renderModuleDots();
        }

        function getCategory(status) {
            if (status === 'not_mastered') return 'r';
            if (status === 'partial') return 'y';
            if (status === 'mastered') return 'g';
            return 'u';
        }

            });

                var likeCount = tip.likes || 0;

                    ? '<span style="font-size:0.65rem;color:var(--yellow);background:rgba(245,158,11,0.15);padding:0.1rem 0.35rem;border-radius:3px;margin-left:0.5rem;">精选</span>'

                            'data-pointid="' + escapeHtml(tip.point_id || '') + '" ' +

                    '</div>' +

        }

        async function shareTip(pointId, moduleName, pointName) {
            if (!currentUser) return;
            var note = assessments[pointId] ? assessments[pointId].note : '';
            if (!note || !note.trim()) {
                showToast('请先在备注中写入内容再分享');
                return;
            }

            var normalizedNote = note.trim().replace(/\s+/g, ' ');

            // Local cache duplicate check first
            var existing = tipsCache.find(function(t) {
                return t.student_name === currentUser.name && t.point_id === pointId && t.content && t.content.trim().replace(/\s+/g, ' ') === normalizedNote;
            });
            if (existing) {
                showToast('你已经发过类似的提示了');
                return;
            }

            // Fresh Supabase query for duplicate check (more reliable, limit 200)
            try {
                var { data: recentTips } = await sb.from('tips')
                    .select('id, student_name, point_id, content')
                    .eq('student_id', currentUser.id)
                    .eq('point_id', pointId)
                    .order('created_at', { ascending: false })
                    .limit(200);
                if (recentTips && recentTips.length > 0) {
                    var dbDuplicate = recentTips.find(function(t) {
                        return t.content && t.content.trim().replace(/\s+/g, ' ') === normalizedNote;
                    });
                    if (dbDuplicate) {
                        showToast('你已经发过类似的提示了');
                        return;
                    }
                }
            } catch (e) {
                // If query fails, proceed with local check only
                console.warn('Duplicate check query failed, proceeding:', e.message);
            }

            try {
                var { data: inserted, error } = await sb.from('tips').insert({
                    student_id: currentUser.id,
                    student_name: currentUser.name,
                    module_name: moduleName,
                    point_name: pointName,
                    point_id: pointId,
                    content: note.trim(),
                    likes: 0
                }).select().single();

                if (error) throw error;
                if (inserted) tipsCache.unshift(inserted);
                renderTips();
                showToast('已分享到论坛');
            } catch (e) {
                showToast('分享失败: ' + e.message);
            }
        }

        async function likeTip(tipId) {
            if (!currentUser) return;
            if (likedTips[tipId]) {
                showToast('你已经点过赞了');
                return;
            }

            try {
                // Increment likes
                var tip = tipsCache.find(function(t) { return t.id === tipId; });
                if (!tip) return;
                var newLikes = (tip.likes || 0) + 1;

                await sb.from('tips').update({ likes: newLikes }).eq('id', tipId);
                await sb.from('tip_likes').insert({
                    student_id: currentUser.id,
                    tip_id: tipId
                });

                tip.likes = newLikes;
                likedTips[tipId] = true;
                renderTips();
            } catch (e) {
                showToast('点赞失败');
            }
        }

        function addTipToNote(tipId, content) {
            // Find the point_id from the tip
            var tip = tipsCache.find(function(t) { return t.id === tipId; });
            if (!tip || !tip.point_id) {
                showToast('无法确定对应知识点');
                return;
            }

            if (!assessments[tip.point_id]) assessments[tip.point_id] = {};
            var existing = assessments[tip.point_id].note || '';
            var newNote = existing ? existing + '\n---\n[' + tip.student_name + '的提示] ' + content : '[' + tip.student_name + '的提示] ' + content;
            assessments[tip.point_id].note = newNote;

            // Save
            doSaveNote(tip.point_id, newNote);
            showToast('已加入你的笔记');

            // Re-render modules to show updated note
            renderModules();
            rebindModuleListeners();
        }

        // ============================================================
        // SIDEBAR
        // ============================================================
        function toggleSidebar() {
            var sidebar = $('sidebar');
            var overlay = $('sidebarOverlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('open');
        }

        function closeSidebar() {
            $('sidebar').classList.remove('open');
            $('sidebarOverlay').classList.remove('open');
        }

        function scrollToSection(sectionId) {
            var el = document.getElementById(sectionId);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
            closeSidebar();
        }

        // ============================================================
        // EXPORT
        // ============================================================
        function exportData() {
            if (!currentUser) return;
            var data = {
                profile: { class: currentUser.class_name, name: currentUser.name },
                scores: STUDENT_SCORES[currentUser.name] || null,
                targets: { math: $('targetMath').value, rank: $('targetRank').value },
                assessments: assessments,
                exportTime: new Date().toISOString(),
                summary: {}
            };
            Object.entries(KB).forEach(function(entry) {
                var key = entry[0], mod = entry[1];
                var s = getModuleStats(key);
                data.summary[key] = {
                    name: mod.name, mastered: s.g, partial: s.y,
                    notMastered: s.r, total: getAllPoints(key).length
                };
            });
            var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = '自评_' + currentUser.name + '_' + new Date().toLocaleDateString('zh-CN') + '.json';
            a.click();
            URL.revokeObjectURL(url);
            showToast('数据已导出');
        }

        // ============================================================
        // LOGOUT
        // ============================================================
        function logout() {
            currentUser = null;
            assessments = {};
            customPoints = {};
            reviewPlans = {};
            tipsCache = [];
            likedTips = {};
            planCheckStates = {};
            moduleSortModes = {};
            dismissedSuggestions = {};
            pendingFirstLogin = false;
            pendingStudentData = null;
            sessionStorage.removeItem('exam_prep_user');
            $('app').style.display = 'none';
            $('pwdChangeScreen').style.display = 'none';
            $('loginScreen').style.display = 'flex';
            $('loginError').style.display = 'none';
        }

        // ============================================================
        // EVENT LISTENERS
        // ============================================================

        // Login
        $('loginBtn').addEventListener('click', doLogin);
        $('loginForm').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); doLogin(); }
        });

        // Password change
        $('changePinBtn').addEventListener('click', doChangePin);
        $('pwdChangeScreen').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && document.activeElement && document.activeElement.id === 'confirmPin') {
                e.preventDefault(); doChangePin();
            }
        });

        // Targets
        $('saveTargetBtn').addEventListener('click', saveTargets);

        // Export / Logout
        $('exportBtn').addEventListener('click', exportData);
        $('logoutBtn').addEventListener('click', logout);

        // Sidebar
        $('hamburgerBtn').addEventListener('click', toggleSidebar);
        $('sidebarClose').addEventListener('click', closeSidebar);
        $('sidebarOverlay').addEventListener('click', closeSidebar);

        // Sidebar navigation
        $('sidebar').addEventListener('click', function(e) {
            var item = e.target.closest('.sidebar-item[data-scroll]');
            if (item) {
                scrollToSection(item.getAttribute('data-scroll'));
            }
        });

        // Calendar modal
        $('calModalCancel').addEventListener('click', closeCalModal);
        $('calModalSave').addEventListener('click', saveCalPlan);
        $('calModal').addEventListener('click', function(e) {
            if (e.target === $('calModal')) closeCalModal();
        });

        // Add task button and Enter key in new task input
        $('calAddTaskBtn').addEventListener('click', function() {
            var input = $('calNewTaskInput');
            var text = input.value.trim();
            if (!text) return;
            modalTasks.push({ text: text, done: false });
            input.value = '';
            renderModalTasks();
        });
        $('calNewTaskInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                $('calAddTaskBtn').click();
            }
        });

        // Module container: delegated events
        function rebindModuleListeners() {
            // Remove and re-add by using a fresh handler
            var mc = $('modulesContainer');
            mc.removeEventListener('click', moduleClickHandler);
            mc.removeEventListener('input', moduleInputHandler);
            mc.addEventListener('click', moduleClickHandler);
            mc.addEventListener('input', moduleInputHandler);
        }

        function moduleClickHandler(e) {
            // Module header expand/collapse
            var header = e.target.closest('.module-header');
            if (header) {
                header.parentElement.classList.toggle('expanded');
                return;
            }

            // Status button
            var statusBtn = e.target.closest('.status-btn');
            if (statusBtn) {
                var pid = statusBtn.getAttribute('data-pid');
                var status = statusBtn.getAttribute('data-status');
                setStatus(pid, status, statusBtn);
                return;
            }

            // Quiz suggestion accept button
            var acceptBtn = e.target.closest('.quiz-sugg-accept');
            if (acceptBtn) {
                e.stopPropagation();
                var qPointId = acceptBtn.getAttribute('data-point');
                var qStatus = acceptBtn.getAttribute('data-status');
                // Set the assessment status (without btnEl, since this is not a status-btn)
                if (!assessments[qPointId]) assessments[qPointId] = {};
                assessments[qPointId].status = qStatus;
                // Save to Supabase
                try {
                    sb.from('self_assessments').upsert({
                        student_id: currentUser.id,
                        point_id: qPointId,
                        status: qStatus,
                        note: assessments[qPointId].note || ''
                    }, { onConflict: 'student_id,point_id' }).then(function() {
                        updateSyncStatus(true);
                    }).catch(function() {
                        updateSyncStatus(false);
                    });
                } catch (_) {}
                // Remove the suggestion UI
                var suggEl = acceptBtn.closest('.quiz-sugg');
                if (suggEl) suggEl.remove();
                // Re-render to update visual (stats, prediction, etc.)
                renderModules();
                rebindModuleListeners();
                renderStats();
                drawRadar();
                renderPrediction();
                renderModuleDots();
                showToast('已采纳小测建议');
                return;
            }

            // Quiz suggestion dismiss button
            var dismissBtn = e.target.closest('.quiz-sugg-dismiss');
            if (dismissBtn) {
                e.stopPropagation();
                var dPointId = dismissBtn.getAttribute('data-point');
                dismissedSuggestions[dPointId] = true;
                var dSuggEl = dismissBtn.closest('.quiz-sugg');
                if (dSuggEl) dSuggEl.remove();
                return;
            }

            // Add custom point button
            var addBtn = e.target.closest('.add-custom-btn');
            if (addBtn) {
                var modKey = addBtn.getAttribute('data-module');
                var input = addBtn.parentElement.querySelector('.custom-point-input');
                if (input && input.value.trim()) {
                    addCustomPoint(modKey, input.value.trim());
                    input.value = '';
                }
                return;
            }

            // Share tip button
            var shareBtn = e.target.closest('.share-tip-btn');
            if (shareBtn) {
                var sPid = shareBtn.getAttribute('data-pid');
                var sModName = shareBtn.getAttribute('data-modname');
                var sPName = shareBtn.getAttribute('data-pname');
                shareTip(sPid, sModName, sPName);
                return;
            }

            // Sort toggle button
            var sortBtn = e.target.closest('.sort-toggle-btn');
            if (sortBtn) {
                var sModKey = sortBtn.getAttribute('data-module');
                toggleSortMode(sModKey);
                return;
            }
        }

        function moduleInputHandler(e) {
            if (e.target.classList.contains('point-note')) {
                var pid = e.target.getAttribute('data-pid');
                saveNoteDebounced(pid, e.target.value);
            }
        }

        // Initial binding
        $('modulesContainer').addEventListener('click', moduleClickHandler);
        $('modulesContainer').addEventListener('input', moduleInputHandler);

        // Tips container: delegated events
        $('tipsList').addEventListener('click', function(e) {
            var likeBtn = e.target.closest('.tip-like-btn');
            if (likeBtn) {
                likeTip(likeBtn.getAttribute('data-tipid'));
                return;
            }
            var addNoteBtn = e.target.closest('.tip-add-note-btn');
            if (addNoteBtn) {
                var tipId = addNoteBtn.getAttribute('data-tipid');
                var content = addNoteBtn.getAttribute('data-content');
                addTipToNote(tipId, content);
                return;
            }
        });

        // ============================================================
        // INITIALIZATION - Restore Session
        // ============================================================
        (async function init() {
            populateDatalist();

            var saved = sessionStorage.getItem('exam_prep_user');
            if (saved) {
                try {
                    var parsed = JSON.parse(saved);
                    if (parsed && parsed.id) {
                        currentUser = parsed;

                        try {
                            var { data } = await sb.from('self_assessments')
                                .select('point_id, status, note')
                                .eq('student_id', currentUser.id);
                            assessments = {};
                            if (data) {
                                data.forEach(function(a) {
                                    assessments[a.point_id] = { status: a.status, note: a.note || '' };
                                });
                            }
                        } catch (_) { assessments = {}; }

                        // Load custom points
                        try {
                            var { data: cpData } = await sb.from('custom_points')
                                .select('module_key, id, point_id, point_name')
                                .eq('student_id', currentUser.id);
                            customPoints = {};
                            if (cpData) {
                                cpData.forEach(function(cp) {
                                    if (!customPoints[cp.module_key]) customPoints[cp.module_key] = [];
                                    customPoints[cp.module_key].push({ id: cp.point_id || cp.id, name: cp.point_name });
                                });
                            }
                        } catch (_) { customPoints = {}; }

                        // Load review plans
                        try {
                            var { data: rpData } = await sb.from('review_plans')
                                .select('plan_date, content')
                                .eq('student_id', currentUser.id);
                            reviewPlans = {};
                            if (rpData) {
                                rpData.forEach(function(rp) {
                                    reviewPlans[rp.plan_date] = rp.content;
                                });
                            }
                        } catch (_) { reviewPlans = {}; }

                        // Load liked tips
                        try {
                            var { data: likeData } = await sb.from('tip_likes')
                                .select('tip_id')
                                .eq('student_id', currentUser.id);
                            likedTips = {};
                            if (likeData) {
                                likeData.forEach(function(l) { likedTips[l.tip_id] = true; });
                            }
                        } catch (_) { likedTips = {}; }

                        $('loginScreen').style.display = 'none';
                        $('app').style.display = 'block';
                        $('profileBadge').textContent = currentUser.class_name + ' ' + currentUser.name;
                        renderScores();
                        loadTargets();
                        loadPlanCheckStates();
                        renderAll();
                        renderCalendar();
                        loadTips();
                    }
                } catch (_) {}
            }
        })();

    </script>
</body>
