<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教师看板 - 高一下数学期末备考</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--bg:#0a0e1a;--card:#141825;--border:#2a2f45;--text:#e8eaf0;--text-dim:#6b7280;--accent:#6366f1;--accent-light:#818cf8;--green:#10b981;--yellow:#f59e0b;--red:#ef4444}
        body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
        .header{background:var(--card);border-bottom:1px solid var(--border);padding:.85rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
        .header h1{font-size:1.3rem}
        .header-right{display:flex;align-items:center;gap:1rem}
        .header a{color:var(--text-dim);text-decoration:none;font-size:.85rem}
        .live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;animation:pulse 2s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
        .container{max-width:1440px;margin:0 auto;padding:1.5rem}

        /* Countdown */
        .countdown-banner{background:linear-gradient(135deg,rgba(99,102,241,.15),rgba(239,68,68,.1));border:1px solid rgba(99,102,241,.3);border-radius:14px;padding:1.25rem 1.5rem;margin-bottom:1.5rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem}
        .countdown-left{display:flex;align-items:baseline;gap:.75rem}
        .countdown-num{font-size:2.8rem;font-weight:800;color:var(--red);line-height:1}
        .countdown-label{font-size:1.1rem}
        .countdown-sub{font-size:.85rem;color:var(--text-dim)}
        .countdown-right{display:flex;gap:1.5rem}
        .countdown-stat{text-align:center}
        .countdown-stat .cs-val{font-size:1.3rem;font-weight:700}
        .countdown-stat .cs-lbl{font-size:.75rem;color:var(--text-dim)}

        /* Stats */
        .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1rem;margin-bottom:1.5rem}
        .stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.15rem}
        .stat-label{color:var(--text-dim);font-size:.8rem;margin-bottom:.4rem}
        .stat-value{font-size:1.7rem;font-weight:700}

        /* Tabs */
        .tab-nav{display:flex;gap:.5rem;margin-bottom:1.5rem;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:.75rem}
        .tab-btn{background:transparent;border:1px solid var(--border);color:var(--text-dim);padding:.5rem 1rem;border-radius:8px;cursor:pointer;font-size:.85rem;transition:all .2s;font-family:inherit}
        .tab-btn:hover{border-color:var(--accent);color:var(--text)}
        .tab-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
        .tab-content{display:none}
        .tab-content.active{display:block}

        /* Calendar */
        .calendar-wrapper{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.25rem;margin-bottom:1.5rem;overflow-x:auto}
        .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:.5rem}
        .cal-header h3{font-size:1rem}
        .cal-legend{display:flex;gap:1rem;font-size:.75rem;color:var(--text-dim);flex-wrap:wrap}
        .cal-legend span{display:flex;align-items:center;gap:.3rem}
        .cal-legend-dot{width:10px;height:10px;border-radius:3px;display:inline-block}
        .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;min-width:750px}
        .cal-dow{text-align:center;font-size:.75rem;color:var(--text-dim);padding:.4rem 0;font-weight:500}
        .cal-cell{position:relative;border:1px solid var(--border);border-radius:8px;padding:.5rem;min-height:95px;cursor:pointer;transition:border-color .2s,background .2s,box-shadow .2s;display:flex;flex-direction:column}
        .cal-cell:hover{border-color:var(--accent)}
        .cal-cell.empty{border-color:transparent;cursor:default;pointer-events:none}
        .cal-cell.empty:hover{border-color:transparent}
        .cal-date{font-size:.85rem;font-weight:600;margin-bottom:.25rem}
        .cal-topic{font-size:.68rem;line-height:1.35;flex:1;overflow:hidden;cursor:text}
        .cal-topic.is-test{color:var(--yellow);font-weight:600}
        .cal-topic[contenteditable="true"]{outline:1px solid var(--accent);border-radius:3px;padding:2px 4px;background:rgba(99,102,241,.08);min-height:1.5em}
        .cal-status-tag{font-size:.6rem;padding:.15rem .35rem;border-radius:3px;margin-top:.25rem;display:inline-block;align-self:flex-start;cursor:pointer;user-select:none}
        .cal-cell.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
        .cal-cell.past .cal-date{opacity:.5;text-decoration:line-through}
        .cal-cell.past .cal-topic{opacity:.85}
        .cal-custom-del:hover{opacity:1!important;color:var(--red)!important}
.sd-priority-btn{background:transparent;border:1px solid var(--border);color:var(--text-dim);font-size:.72rem;padding:2px 8px;border-radius:4px;cursor:pointer;margin-left:8px;transition:all .2s;}
.sd-priority-btn.active{color:var(--accent-light);border-color:var(--accent-light);background:rgba(99,102,241,.1);}
.sd-priority-btn:hover{border-color:var(--accent-light);}
.sd-teacher-select:focus{outline:1px solid var(--accent);border-color:var(--accent);}
.sd-teacher-note:focus{outline:1px solid var(--accent);border-color:var(--accent);}
.sd-save-note-btn:hover{background:var(--accent-light)!important;}
        .cal-cell.exam-day{border-color:var(--red);background:rgba(239,68,68,.08);box-shadow:0 0 12px rgba(239,68,68,.2)}
        .cal-cell.exam-day .cal-date{color:var(--red);font-size:1rem}

        /* Class hours label next to date */
        .cal-class-hrs{font-size:.6rem;color:var(--accent-light);font-weight:400;margin-left:.15rem}
        .cal-class-hrs.quiz{color:var(--yellow)}
        .cal-dow-short{font-size:.6rem;color:var(--text-dim);font-weight:400;margin-left:.1rem}

        /* Calendar task checkbox (macOS Calendar style) */
        .cal-task-check{display:flex;align-items:flex-start;gap:.25rem;flex:1;overflow:hidden}
        .cal-task-check input[type="checkbox"]{margin-top:1px;flex-shrink:0;cursor:pointer;accent-color:var(--accent);width:12px;height:12px}
        .cal-task-check .cal-topic{flex:1}
        .cal-task-check.checked .cal-topic{text-decoration:line-through;color:var(--text-dim) !important}

        /* Calendar task lines (multi-task) */
        .cal-task-line input[type="text"]{font-size:.72rem;background:transparent;border:none;color:var(--text);outline:none;width:100%;padding:1px 0;border-bottom:1px solid transparent}
        .cal-task-line input[type="text"]:focus{border-bottom-color:var(--accent)}
        .cal-inline-add::placeholder{color:var(--text-dim);font-size:.65rem}

        /* Drop flash confirmation */
        @keyframes dropFlash{0%{box-shadow:0 0 0 2px var(--accent),0 0 18px rgba(99,102,241,.5)}100%{box-shadow:none}}
        .cal-cell.drop-flash{animation:dropFlash .5s ease-out}
        .cal-cell.self-review{border-style:dashed}
        .cal-cell.status-completed{border-color:var(--green);background:rgba(16,185,129,.06)}
        .cal-cell.status-in_progress{border-color:var(--yellow);background:rgba(245,158,11,.06)}
        .cal-cell.drag-over{border-color:var(--accent)!important;background:rgba(99,102,241,.12)!important;box-shadow:0 0 12px rgba(99,102,241,.3)}
        .cal-cell.dragging{opacity:.4}
        .tag-completed{background:rgba(16,185,129,.2);color:var(--green)}
        .tag-in_progress{background:rgba(245,158,11,.2);color:var(--yellow)}
        .tag-pending{background:rgba(107,114,128,.15);color:var(--text-dim)}
        .tag-exam{background:rgba(239,68,68,.2);color:var(--red)}
        .tag-self{background:rgba(99,102,241,.12);color:var(--accent-light)}
        .edit-hint{position:absolute;top:2px;right:4px;font-size:.6rem;color:var(--text-dim);opacity:0;transition:opacity .2s}
        .cal-cell:hover .edit-hint{opacity:1}

        /* Status popover */
        .status-popover{position:fixed;z-index:300;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:.5rem;box-shadow:0 8px 24px rgba(0,0,0,.4);display:none}
        .status-popover.show{display:block}
        .status-popover button{display:block;width:100%;padding:.5rem 1rem;border:none;background:transparent;color:var(--text);font-size:.82rem;cursor:pointer;text-align:left;border-radius:4px;white-space:nowrap;font-family:inherit}
        .status-popover button:hover{background:rgba(255,255,255,.05)}

        /* Section title */
        .sec-title{font-size:1.15rem;font-weight:600;margin:1.5rem 0 1rem;display:flex;align-items:center;gap:.5rem}

        /* Module cards */
        .modules-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));gap:1rem;margin-bottom:1.5rem}
        .mod-card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
        .mod-head{padding:1rem 1.25rem;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
        .mod-head:hover{background:rgba(255,255,255,.02)}
        .mod-info{flex:1}
        .mod-name{font-size:1rem;font-weight:600;margin-bottom:.15rem}
        .mod-meta{color:var(--text-dim);font-size:.78rem}
        .mod-right{display:flex;align-items:center;gap:.75rem}
        .mod-bar{width:80px;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
        .mod-bar-fill{height:100%;border-radius:3px;transition:width .3s}
        .mod-pct{font-size:.78rem;min-width:36px;text-align:right;color:var(--text-dim)}
        .mod-expand{color:var(--text-dim);font-size:.8rem;transition:transform .3s}
        .mod-card.expanded .mod-expand{transform:rotate(180deg)}
        .mod-body{display:none;border-top:1px solid var(--border)}
        .mod-card.expanded .mod-body{display:block}
        .mod-table{width:100%;border-collapse:collapse}
        .mod-table th,.mod-table td{padding:.6rem 1rem;text-align:left;border-bottom:1px solid var(--border);font-size:.82rem}
        .mod-table th{background:rgba(255,255,255,.02);color:var(--text-dim);font-weight:500;font-size:.75rem}
        .w-high{color:var(--red)}.w-mid{color:var(--yellow)}.w-low{color:var(--green)}
        .selfeval-bar{display:flex;height:16px;border-radius:3px;overflow:hidden;cursor:pointer;min-width:80px;position:relative}
        .selfeval-bar .seg{height:100%;transition:width .3s}
        .selfeval-bar .seg-g{background:var(--green)}
        .selfeval-bar .seg-y{background:var(--yellow)}
        .selfeval-bar .seg-r{background:var(--red)}
        .selfeval-bar-label{font-size:.7rem;color:var(--text-dim);margin-left:.3rem;white-space:nowrap}

        /* Assessment popup */
        .assess-popup{position:fixed;z-index:350;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:1rem;box-shadow:0 12px 36px rgba(0,0,0,.5);display:none;width:360px;max-height:400px;overflow-y:auto}
        .assess-popup.show{display:block}
        .assess-popup h4{font-size:.9rem;margin-bottom:.75rem;color:var(--accent-light)}
        .assess-popup .cat-group{margin-bottom:.75rem}
        .assess-popup .cat-title{font-size:.78rem;font-weight:600;margin-bottom:.3rem;display:flex;align-items:center;gap:.3rem}
        .assess-popup .cat-title .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
        .assess-popup .student-chip{display:inline-block;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:4px;padding:.15rem .4rem;font-size:.72rem;margin:.15rem .15rem .15rem 0}
        .assess-popup .close-btn{position:absolute;top:.5rem;right:.75rem;background:none;border:none;color:var(--text-dim);font-size:1rem;cursor:pointer}

        /* Heatmap */
        .heatmap-section{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:1.25rem;margin-bottom:1.5rem}
        .heatmap-scroll{overflow-x:auto}
        .hm-table{width:100%;border-collapse:collapse;min-width:750px}
        .hm-table th,.hm-table td{padding:.5rem .6rem;text-align:center;border-bottom:1px solid var(--border);font-size:.78rem}
        .hm-table th{background:rgba(255,255,255,.03);color:var(--text-dim);font-weight:500;font-size:.72rem}
        .hm-table td.hm-name{text-align:left;font-weight:500}
        .hm-table tr.hm-module{background:rgba(99,102,241,.05);cursor:pointer}
        .hm-table tr.hm-module:hover{background:rgba(99,102,241,.1)}
        .hm-table tr.hm-point{display:none}
        .hm-table tr.hm-point.visible{display:table-row}
        .hm-green{background:rgba(16,185,129,.2);color:var(--green)}
        .hm-yellow{background:rgba(245,158,11,.2);color:var(--yellow)}
        .hm-red{background:rgba(239,68,68,.2);color:var(--red)}
        .hm-gray{background:rgba(107,114,128,.1);color:var(--text-dim)}

        /* Student list */
        .student-section{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:1.25rem;margin-bottom:1.5rem}
        .student-filter{display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap}
        .student-filter select,.student-filter input{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:.4rem .7rem;border-radius:6px;font-size:.82rem;font-family:inherit}
        .student-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.75rem}
        .student-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:.85rem;cursor:pointer;transition:border-color .2s,transform .15s}
        .student-card:hover{border-color:var(--accent);transform:translateY(-2px)}
        .sc-name{font-weight:600;font-size:.9rem;margin-bottom:.15rem}
        .sc-class{color:var(--text-dim);font-size:.75rem;margin-bottom:.35rem}
        .sc-target{font-size:.72rem;color:var(--accent-light);margin-bottom:.35rem}
        .sc-stats{display:flex;gap:.5rem;font-size:.75rem}
        .sc-stat{display:flex;align-items:center;gap:.2rem}
        .sc-dot{width:6px;height:6px;border-radius:50%}

        /* Student detail overlay */
        .student-detail-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:400;display:none;overflow-y:auto;padding:2rem 1rem}
        .student-detail-overlay.show{display:flex;align-items:flex-start;justify-content:center}
        .student-detail{background:var(--card);border:1px solid var(--border);border-radius:14px;width:100%;max-width:900px;padding:2rem;position:relative}
        .sd-close{position:absolute;top:1rem;right:1.25rem;background:none;border:none;color:var(--text-dim);font-size:1.4rem;cursor:pointer}
        .sd-close:hover{color:var(--text)}
        .sd-header{display:flex;gap:1.5rem;margin-bottom:1.5rem;flex-wrap:wrap;align-items:flex-start}
        .sd-header-info h2{font-size:1.3rem;margin-bottom:.25rem}
        .sd-header-info p{color:var(--text-dim);font-size:.85rem}
        .sd-score-cards{display:flex;gap:1rem;flex-wrap:wrap}
        .sd-score-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:.75rem 1rem;min-width:140px}
        .sd-score-card .label{font-size:.72rem;color:var(--text-dim)}
        .sd-score-card .value{font-size:1.2rem;font-weight:700}
        .sd-section{margin-bottom:1.5rem}
        .sd-section h3{font-size:1rem;font-weight:600;margin-bottom:.75rem;color:var(--accent-light);border-bottom:1px solid var(--border);padding-bottom:.4rem}
        .sd-kp-table{width:100%;border-collapse:collapse}
        .sd-kp-table th,.sd-kp-table td{padding:.5rem .75rem;text-align:left;border-bottom:1px solid var(--border);font-size:.82rem}
        .sd-kp-table th{color:var(--text-dim);font-weight:500;font-size:.72rem;background:rgba(255,255,255,.02)}
        .sd-note-item{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:.6rem .8rem;margin-bottom:.4rem;font-size:.82rem}
        .sd-note-item .point-label{color:var(--accent-light);font-size:.72rem;margin-bottom:.2rem}
        .sd-plan-item{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:.6rem .8rem;margin-bottom:.4rem;font-size:.82rem}
        .sd-plan-item .plan-date{color:var(--accent-light);font-size:.72rem;margin-bottom:.2rem}
        .sd-empty{color:var(--text-dim);font-size:.85rem;font-style:italic}

        /* Tips */
        .tips-section{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:1.25rem;margin-bottom:1.5rem}
        .tips-list{display:flex;flex-direction:column;gap:.75rem}
        .tip-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:1rem;position:relative}
        .tip-card.featured{border-color:var(--yellow);background:rgba(245,158,11,.04)}
        .tip-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem;flex-wrap:wrap;gap:.3rem}
        .tip-author{font-weight:600;font-size:.85rem}
        .tip-point{font-size:.72rem;color:var(--accent-light);background:rgba(99,102,241,.1);padding:.1rem .4rem;border-radius:3px}
        .tip-content{font-size:.88rem;line-height:1.5;margin-bottom:.5rem}
        .tip-footer{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;color:var(--text-dim)}
        .tip-likes{display:flex;align-items:center;gap:.3rem}
        .tip-actions{display:flex;gap:.5rem}
        .tip-btn{background:transparent;border:1px solid var(--border);color:var(--text-dim);padding:.25rem .6rem;border-radius:4px;cursor:pointer;font-size:.72rem;font-family:inherit;transition:all .2s}
        .tip-btn:hover{border-color:var(--accent);color:var(--text)}
        .tip-btn.featured-btn{border-color:var(--yellow);color:var(--yellow)}
        .tip-featured-badge{position:absolute;top:.5rem;right:.5rem;font-size:.65rem;color:var(--yellow);background:rgba(245,158,11,.15);padding:.1rem .4rem;border-radius:3px}

        /* Loading */
        .loading{text-align:center;padding:2rem;color:var(--text-dim)}

        @media(max-width:768px){
            .container{padding:1rem}
            .countdown-banner{flex-direction:column;text-align:center}
            .countdown-left{justify-content:center}
            .countdown-right{justify-content:center}
            .modules-grid{grid-template-columns:1fr}
            .student-grid{grid-template-columns:1fr 1fr}
            .cal-cell{min-height:70px;padding:.35rem}
            .cal-topic{font-size:.6rem}
            .student-detail{padding:1.25rem}
            .sd-header{flex-direction:column}
        }

        /* Login screen */
        .teacher-login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
        .teacher-login h1{font-size:1.6rem;margin-bottom:.5rem;background:linear-gradient(135deg,var(--accent-light),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .teacher-login .subtitle{color:var(--text-dim);margin-bottom:2rem;font-size:.9rem}
        .teacher-login-form{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:2rem;width:100%;max-width:360px}
        .teacher-login-form label{display:block;font-size:.85rem;color:var(--text-dim);margin-bottom:.3rem}
        .teacher-login-form input{width:100%;padding:.85rem 1rem;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-size:1rem;margin-bottom:.75rem}
        .teacher-login-form input:focus{outline:none;border-color:var(--accent)}
        .teacher-login-form button{width:100%;padding:.85rem;background:var(--accent);color:white;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;margin-top:.5rem}
        .teacher-login-form button:active{opacity:.85}
        .teacher-login-error{color:var(--red);font-size:.8rem;margin-top:.5rem;display:none;text-align:center}
        #mainApp{display:none}

        /* Quiz Detail Modal */
        .quiz-detail-modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:500;display:none;overflow-y:auto;padding:2rem 1rem}
        .quiz-detail-modal.show{display:flex;align-items:flex-start;justify-content:center}
        .quiz-detail-modal-box{background:var(--card);border:1px solid var(--border);border-radius:14px;width:100%;max-width:800px;padding:2rem;position:relative;max-height:90vh;overflow-y:auto}
        .quiz-detail-modal-box h2{font-size:1.15rem;margin-bottom:.25rem;color:var(--accent-light)}
        .quiz-detail-modal-box .qdm-date{font-size:.82rem;color:var(--text-dim);margin-bottom:1rem}
        .quiz-detail-modal-box .qdm-close{position:absolute;top:1rem;right:1.25rem;background:none;border:none;color:var(--text-dim);font-size:1.4rem;cursor:pointer}
        .quiz-detail-modal-box .qdm-close:hover{color:var(--text)}
        .qdm-table{width:100%;border-collapse:collapse;font-size:.78rem}
        .qdm-table th{text-align:left;padding:.5rem .6rem;color:var(--text-dim);font-weight:500;border-bottom:1px solid var(--border);font-size:.72rem}
        .qdm-table td{padding:.5rem .6rem;border-bottom:1px solid rgba(42,47,69,.4)}
        .qdm-table tr:last-child td{border-bottom:none}
        .qdm-wrong-students{font-size:.7rem;color:var(--red)}

        /* Heatmap count popup */
        .hm-count-popup{position:fixed;z-index:400;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.75rem 1rem;box-shadow:0 12px 36px rgba(0,0,0,.5);max-width:320px;max-height:300px;overflow-y:auto;font-size:.78rem}
        .hm-count-popup .popup-title{font-weight:600;margin-bottom:.4rem;font-size:.82rem}
        .hm-count-popup .popup-chip{display:inline-block;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:4px;padding:.1rem .4rem;font-size:.72rem;margin:.1rem .1rem .1rem 0}

        /* Password reset button */
        .sd-reset-btn{background:transparent;border:1px solid var(--red);color:var(--red);padding:.35rem .75rem;border-radius:6px;font-size:.78rem;cursor:pointer;font-family:inherit;margin-left:.75rem;transition:all .2s}
        .sd-reset-btn:hover{background:rgba(239,68,68,.1)}
    </style>
</head>
<body>
    <!-- Teacher Login Screen -->
    <div class="teacher-login" id="teacherLogin">
        <h1>高一下数学期末备考</h1>
        <p class="subtitle">教师看板 · 请登录</p>
        <div class="teacher-login-form">
            <label>账号</label>
            <input type="text" id="loginUser" placeholder="请输入账号" autocomplete="off">
            <label>密码</label>
            <input type="password" id="loginPass" placeholder="请输入密码">
            <button id="loginBtn">进入看板</button>
            <div class="teacher-login-error" id="loginError"></div>
        </div>
    </div>

    <!-- Main App (hidden until login) -->
    <div id="mainApp">
    <div class="header">
        <h1>教师备课看板</h1>
        <div class="header-right">
            <span style="font-size:.8rem;color:var(--text-dim)"><span class="live-dot"></span> 实时同步</span>
            <a href="#" id="logoutBtn" style="color:var(--red);font-size:.8rem">退出登录</a>
            <a href="index.html">返回</a>
        </div>
    </div>

    <div class="container">
        <!-- Countdown Banner -->
        <div class="countdown-banner" id="countdownBanner">
            <div class="countdown-left">
                <span class="countdown-num" id="countdownNum">--</span>
                <div>
                    <div class="countdown-label">距离期末考试还有</div>
                    <div class="countdown-sub">考试日期：2026年7月8日（周三）</div>
                </div>
            </div>
            <div class="countdown-right">
                <div class="countdown-stat"><div class="cs-val" style="color:var(--green)" id="cdReviewDone">0</div><div class="cs-lbl">已完成复习日</div></div>
                <div class="countdown-stat"><div class="cs-val" style="color:var(--yellow)" id="cdReviewLeft">10</div><div class="cs-lbl">待复习日</div></div>
                <div class="countdown-stat"><div class="cs-val" style="color:var(--accent-light)" id="cdSelfDays">13</div><div class="cs-lbl">自主复习日</div></div>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-row">
            <div class="stat-card"><div class="stat-label">复习进度</div><div class="stat-value" style="color:var(--accent-light)" id="stProgress">0/10</div></div>
            <div class="stat-card"><div class="stat-label">注册学生</div><div class="stat-value" style="color:var(--yellow)" id="stStudents">0</div></div>
            <div class="stat-card"><div class="stat-label">已评估知识点</div><div class="stat-value" style="color:var(--green)" id="stAssessed">0%</div></div>
            <div class="stat-card"><div class="stat-label">班级平均掌握度</div><div class="stat-value" id="stAvgMastery">--</div></div>
            <div class="stat-card"><div class="stat-label">预警知识点</div><div class="stat-value" style="color:var(--red)" id="stWarnings">0</div></div>
        </div>

        <!-- Tab Navigation -->
        <div class="tab-nav">
            <button class="tab-btn active" data-tab="calendar">备考日历</button>
            <button class="tab-btn" data-tab="modules">知识模块追踪</button>
            <button class="tab-btn" data-tab="heatmap">掌握度热力图</button>
            <button class="tab-btn" data-tab="students">学生列表</button>
            <button class="tab-btn" data-tab="tips">温馨提示论坛</button>
        </div>

        <!-- TAB: Calendar -->
        <div class="tab-content active" id="tab-calendar">
            <div class="calendar-wrapper">
                <div class="cal-header">
                    <h3>2026年6月11日 - 7月8日</h3>
                    <div class="cal-legend">
                        <span><span class="cal-legend-dot" style="background:var(--accent)"></span>今天</span>
                        <span><span class="cal-legend-dot" style="background:var(--green)"></span>已完成</span>
                        <span><span class="cal-legend-dot" style="background:var(--yellow)"></span>进行中</span>
                        <span><span class="cal-legend-dot" style="background:var(--border)"></span>待开始</span>
                        <span><span class="cal-legend-dot" style="background:var(--red)"></span>考试日</span>
                        <span><span class="cal-legend-dot" style="border:1px dashed var(--accent-light);background:transparent"></span>自主复习</span>
                    </div>
                </div>
                <div class="cal-grid" id="calendarGrid"></div>
            </div>
        </div>

        <!-- TAB: Modules -->
        <div class="tab-content" id="tab-modules">
            <div class="sec-title">知识模块追踪（二级指标）</div>
            <div class="modules-grid" id="modulesGrid"></div>
        </div>

        <!-- TAB: Heatmap -->
        <div class="tab-content" id="tab-heatmap">
            <div class="sec-title">班级掌握热力图</div>
            <div class="heatmap-section">
                <div class="heatmap-scroll" id="heatmapContainer">
                    <div class="loading">加载数据中...</div>
                </div>
            </div>
        </div>

        <!-- TAB: Students -->
        <div class="tab-content" id="tab-students">
            <div class="sec-title">学生列表</div>
            <div class="student-section">
                <div class="student-filter">
                    <select id="classFilter"><option value="">全部班级</option></select>
                    <input type="text" id="studentSearch" placeholder="搜索学生姓名...">
                </div>
                <div class="student-grid" id="studentGrid"><div class="loading">加载中...</div></div>
            </div>
        </div>

        <!-- TAB: Tips -->
        <div class="tab-content" id="tab-tips">
            <div class="sec-title">温馨提示论坛</div>
            <div class="tips-section">
                <div class="tips-list" id="tipsList"><div class="loading">加载中...</div></div>
            </div>
        </div>
    </div>

    <!-- Status popover -->
    <div class="status-popover" id="statusPopover"></div>

    <!-- Assessment popup -->
    <div class="assess-popup" id="assessPopup"></div>

    <!-- Student detail overlay -->
    <div class="student-detail-overlay" id="studentDetailOverlay">
        <div class="student-detail" id="studentDetailContent"></div>
    </div>

    <!-- Quiz detail modal -->
    <div class="quiz-detail-modal" id="quizDetailModal">
        <div class="quiz-detail-modal-box" id="quizDetailModalContent"></div>
    </div>

    <script>
    // ================================================================
    // SUPABASE (embedded, no CDN dependency)
    // ================================================================
    var sb = supabase.createClient(
        'https://zeijwibhhtznoagevaeh.supabase.co',
        'sb_publishable_HaQf-0CDYDEet6xuTCauMw_MZxKPMty'
    );

    // ================================================================
    // TEACHER LOGIN
    // ================================================================
    const TEACHER_ACCOUNTS = {
        '黎老师': 'lixinyi'
    };

    function checkTeacherLogin() {
        if (sessionStorage.getItem('teacher_logged_in') === 'true') {
            showMainApp();
            return true;
        }
        return false;
    }

    function showMainApp() {
        document.getElementById('teacherLogin').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
    }

    function doTeacherLogin() {
        var user = document.getElementById('loginUser').value.trim();
        var pass = document.getElementById('loginPass').value;
        var errEl = document.getElementById('loginError');

        errEl.style.display = 'none';
        errEl.textContent = '';

        if (!user || !pass) {
            errEl.textContent = '请输入账号和密码';
            errEl.style.display = 'block';
            return;
        }

        if (TEACHER_ACCOUNTS[user] === pass) {
            sessionStorage.setItem('teacher_logged_in', 'true');
            showMainApp();
            // Init data after login
            initApp();
        } else {
            errEl.textContent = '账号或密码错误，请重试';
            errEl.style.display = 'block';
            document.getElementById('loginPass').value = '';
            document.getElementById('loginPass').focus();
        }
    }

    document.getElementById('loginBtn').addEventListener('click', doTeacherLogin);
    document.getElementById('loginPass').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); doTeacherLogin(); }
    });
    document.getElementById('loginUser').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); document.getElementById('loginPass').focus(); }
    });

    // Logout handler
    document.getElementById('logoutBtn').addEventListener('click', function(e) {
        e.preventDefault();
        sessionStorage.removeItem('teacher_logged_in');
        appInitialized = false;
        document.getElementById('mainApp').style.display = 'none';
        document.getElementById('teacherLogin').style.display = 'flex';
        document.getElementById('loginPass').value = '';

    const ALL_QUIZZES = [QUIZ_DATA_0526, QUIZ_DATA_0603, QUIZ_DATA_0611, QUIZ_DATA_0612];

    // Build aggregate point → quiz question mapping (across all quizzes)
    const pointToQuiz = {};
    ALL_QUIZZES.forEach(quiz => {
        quiz.questions.forEach(q => {
            q.points.forEach(pid => {
                if (!pointToQuiz[pid]) pointToQuiz[pid] = [];
                pointToQuiz[pid].push({...q, _quiz: quiz});
            });
        });
    });

    // Per-quiz point→question mapping helper
    function getPointToQuizForQuiz(quiz) {
        const m = {};
        quiz.questions.forEach(q => {
            q.points.forEach(pid => {
                if (!m[pid]) m[pid] = [];
                m[pid].push(q);
            });
        });
        return m;
    }

    // Compute aggregate module-level quiz summary (across all quizzes)
    const moduleQuizSummary = {};
    ALL_QUIZZES.forEach(quiz => {
        quiz.questions.forEach(q => {
            if (!moduleQuizSummary[q.module]) moduleQuizSummary[q.module] = 0;
            moduleQuizSummary[q.module]++;
        });
    });

    // Per-quiz module summary helper
    function getModuleQuizSummaryForQuiz(quiz) {
        const s = {};
        quiz.questions.forEach(q => {
            if (!s[q.module]) s[q.module] = 0;
            s[q.module]++;
        });
        return s;
    }

    // Helper: compute correct rate for a given quiz and question number
    function getQuestionCorrectRate(quiz, qNum) {
        if (quiz.status) return null; // Skip placeholder quizzes
        if (!quiz.scores) return null;
        const studentNames = Object.keys(quiz.scores);
        if (!studentNames.length) return null;
        let correct = 0;
        studentNames.forEach(name => {
            const s = quiz.scores[name];
            const qData = s.questions.find(q => q.q === qNum);
            if (qData && qData.score === 5) correct++;
        });
        return Math.round(correct / studentNames.length * 100);
    }

    // Helper: compute average correct rate for questions in a module (specific quiz)
    function getModuleAvgCorrectRate(quiz, moduleName) {
        const modQuestions = quiz.questions.filter(q => q.module === moduleName);
        if (!modQuestions.length) return null;
        let totalRate = 0;
        let count = 0;
        modQuestions.forEach(q => {
            const rate = getQuestionCorrectRate(quiz, q.q);
            if (rate !== null) {
                totalRate += rate;
                count++;
            }
        });
        return count > 0 ? Math.round(totalRate / count) : null;
    }

    // Aggregate correct rate across all quizzes for a module
    function getAggModuleAvgCorrectRate(moduleName) {
        let totalRate = 0, count = 0;
        ALL_QUIZZES.forEach(quiz => {
            const rate = getModuleAvgCorrectRate(quiz, moduleName);
            if (rate !== null) { totalRate += rate; count++; }
        });
        return count > 0 ? Math.round(totalRate / count) : null;
    }

    // Aggregate correct rate across all quizzes for a point_id
    function getAggQuestionCorrectRate(pointId) {
        let totalRate = 0, count = 0;
        ALL_QUIZZES.forEach(quiz => {
            const qs = quiz.questions.filter(q => q.points.includes(pointId));
            qs.forEach(q => {
                const rate = getQuestionCorrectRate(quiz, q.q);
                if (rate !== null) { totalRate += rate; count++; }
            });
        });
        return count > 0 ? Math.round(totalRate / count) : null;
    }

    // Most recent quiz data takes priority for conflicts

            realQuizzes.forEach(quiz => {
                const hasQ = quiz.questions.find(q => q.points.includes(p.id));

                Object.entries(quiz.scores).forEach(([name, scoreData]) => {
                    const qResult = scoreData.questions.find(sq => sq.q === hasQ.q);
                    if (!qResult) return;
                    if (!autoMap[p.id][name]) autoMap[p.id][name] = [];
                    autoMap[p.id][name].push({
                        correct: qResult.score === 5,
                        wrong: qResult.score < 5,
                        date: quiz.date,
                        quizName: quiz.name
                    });
                });
            });
        });

        const result = {};
        Object.entries(autoMap).forEach(([pid, studentData]) => {
            result[pid] = {};
            Object.entries(studentData).forEach(([name, attempts]) => {
                const totalCorrect = attempts.filter(a => a.correct).length;
                const totalWrong = attempts.filter(a => a.wrong).length;
                const totalAttempts = attempts.length;

                // Use most recent quiz as tiebreaker for conflicts
                const latest = attempts[attempts.length - 1];
                const latestCorrect = latest.correct ? 1 : 0;
                const latestWrong = latest.wrong ? 1 : 0;

                let status;
                if (totalWrong >= 3 && totalCorrect >= 3) {
                    // Conflict: both thresholds met, use most recent data
                    if (latestWrong) status = 'not_mastered';
                    else if (latestCorrect) status = 'mastered';
                    else status = 'partial';
                } else if (totalWrong >= 3) {
                    status = 'not_mastered';
                } else if (totalCorrect >= 3) {
                    status = 'mastered';
                } else {
                    status = 'partial';
                }

                result[pid][name] = {
                    status,
                    correct: totalCorrect,
                    wrong: totalWrong,
                    total: totalAttempts
                };
            });
        });
        return result;
    }

    // Compute homework submission stats per student
    function computeHomeworkStats() {
        const stats = {};
        const realQuizzes = ALL_QUIZZES.filter(q => !q.status);
        students.forEach(s => {
            let submitted = 0, notSubmitted = 0, totalScore = 0, totalCount = 0, lowScores = 0;
            realQuizzes.forEach(quiz => {
                const max = quiz.total || 100;
                const threshold = max * 0.8; // 80% as passing
                if (quiz.scores[s.name]) {
                    submitted++;
                    totalScore += quiz.scores[s.name].total;
                    totalCount++;
                    if (quiz.scores[s.name].total < threshold) lowScores++;
                } else if (quiz.submitted.includes(s.name)) {
                    submitted++;
                    totalCount++;
                } else {
                    notSubmitted++;
                }
            });
            const avg = totalCount > 0 ? Math.round(totalScore / totalCount) : 0;
            const avgRate = totalCount > 0 ? Math.round(totalScore / (totalCount * (realQuizzes[0] ? realQuizzes[0].total || 100 : 100)) * 100) : 0;
            stats[s.name] = { submitted, notSubmitted, avg, lowScores, totalQuizzes: realQuizzes.length, avgRate };
        });
        return stats;
    }

                    cell.classList.add('dragging');
                    e.dataTransfer.setData('text/plain', String(dayNum));
                    e.dataTransfer.effectAllowed = 'move';
                });
                cell.addEventListener('dragend', () => {
                    isDragging = false;
                    cell.classList.remove('dragging');
                    document.querySelectorAll('.cal-cell.drag-over').forEach(c => c.classList.remove('drag-over'));
                });
            }

            // === DROP events (for all non-empty cells) ===
            if (!cell.classList.contains('empty')) {
                cell.addEventListener('dragover', (e) => {
                    if (!isDragging) return;
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    cell.classList.add('drag-over');
                });
                cell.addEventListener('dragleave', () => {
                    cell.classList.remove('drag-over');
                });
                cell.addEventListener('drop', async (e) => {
                    e.preventDefault();
                    cell.classList.remove('drag-over');
                    const draggedDayNum = parseInt(e.dataTransfer.getData('text/plain'));
                    const targetDateKey = cell.dataset.dateKey;
                    if (!targetDateKey || !draggedDayNum) return;

                    const sourceDateKey = reviewDayDateMap[draggedDayNum];
                    if (sourceDateKey === targetDateKey) return;

                    // Check if target already has a review day
                    const dateToDayNow = getDateToDayMap();
                    const targetDayNum = dateToDayNow[targetDateKey];

                    if (targetDayNum) {
                        // Swap: target day goes to source date
                        reviewDayDateMap[targetDayNum] = sourceDateKey;
                        await saveDayDateMapping(targetDayNum, sourceDateKey);
                    }
                    // Move dragged day to target date
                    reviewDayDateMap[draggedDayNum] = targetDateKey;
                    await saveDayDateMapping(draggedDayNum, targetDateKey);

                    renderCalendar();

                    // Flash the target cell to confirm the move
                    const flashCell = document.querySelector(`.cal-cell[data-date-key="${targetDateKey}"]`);
                    if (flashCell) {
                        flashCell.classList.add('drop-flash');
                        setTimeout(() => flashCell.classList.remove('drop-flash'), 600);
                    }
                });
            }

            // === CLICK events ===
            cell.addEventListener('click', (e) => {
                if (isDragging) return;

                // Checkbox click -> toggle strikethrough (multi-task)
                const checkbox = e.target.closest('[data-task-check]');
                if (checkbox) {
                    e.stopPropagation();
                    const key = `cal-task-checked-${checkbox.dataset.taskCheck}`;
                    localStorage.setItem(key, checkbox.checked);
                    // Update visual
                    const textEl = checkbox.parentElement.querySelector('[data-task-text]');
                    if (textEl) {
                        textEl.style.textDecoration = checkbox.checked ? 'line-through' : 'none';
                        textEl.style.opacity = checkbox.checked ? '0.5' : '1';
                    }
                    return;
                }

                // Status tag click -> show popover
                const statusTag = e.target.closest('[data-status-action]');
                if (statusTag) {
                    e.stopPropagation();
                    const dn = parseInt(statusTag.dataset.dayNum);
                    const ri = INITIAL_REVIEW_DAYS[dn];
                    showStatusPopover(e, dn, ri ? ri.topic : '', status || 'pending');
                    return;
                }

                // Topic text click -> inline edit (for test days with data-editable)
                const topicEl = e.target.closest('[data-editable]');
                if (topicEl) {
                    e.stopPropagation();
                    startInlineEdit(topicEl);
                    return;
                }

                // Task text click -> inline edit individual task
                const taskTextEl = e.target.closest('[data-task-text]');
                if (taskTextEl) {
                    e.stopPropagation();
                    const [dn, ti] = taskTextEl.dataset.taskText.split('-').map(Number);
                    taskTextEl.dataset.dayNum = String(dn);
                    taskTextEl.dataset.taskIdx = String(ti);
                    taskTextEl.dataset.editable = 'true';
                    startInlineEdit(taskTextEl);
                    return;
                }
            });

            grid.appendChild(cell);
            cursor.setDate(cursor.getDate() + 1);
        }

        // Fill trailing empty cells
        const totalCells = grid.children.length - 7;
        const remainder = totalCells % 7;
        if (remainder > 0) {
            for (let i = 0; i < (7 - remainder); i++) {
                const empty = document.createElement('div');
                empty.className = 'cal-cell empty';
                grid.appendChild(empty);
            }
        }
    }

    // ================================================================
    // INLINE EDITING for calendar topics
    // ================================================================
    function startInlineEdit(el) {
        if (el.getAttribute('contenteditable') === 'true') return;
        const dayNum = parseInt(el.dataset.dayNum);
        const originalText = el.textContent;
        const taskIdx = el.dataset.taskIdx !== undefined ? parseInt(el.dataset.taskIdx) : null;

        el.setAttribute('contenteditable', 'true');
        el.focus();

        // Select all text
        const range = document.createRange();
        range.selectNodeContents(el);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);

        const finishEdit = async () => {
            el.setAttribute('contenteditable', 'false');
            const newText = el.textContent.trim() || originalText;
            if (newText !== originalText) {
                const existing = dailyProgress.find(d => d.day_number === dayNum);
                if (taskIdx !== null) {
                    // Editing a single task within the task list
                    const currentTopic = (existing && existing.topic) ? existing.topic : (INITIAL_REVIEW_DAYS[dayNum] ? INITIAL_REVIEW_DAYS[dayNum].topic : '');
                    const tasks = parseTopicTasks(currentTopic);
                    if (taskIdx >= 0 && taskIdx < tasks.length) {
                        tasks[taskIdx].text = newText;
                    }
                    const newTopicStr = topicTasksToText(tasks);
                    if (existing) {
                        existing.topic = newTopicStr;
                    } else {
                        dailyProgress.push({ day_number: dayNum, topic: newTopicStr, status: 'pending' });
                    }
                    await saveTopicEdit(dayNum, newTopicStr);
                } else {
                    // Editing whole topic (test days)
                    if (existing) {
                        existing.topic = newText;
                    } else {
                        dailyProgress.push({ day_number: dayNum, topic: newText, status: 'pending' });
                    }
                    await saveTopicEdit(dayNum, newText);
                }
            }
            el.removeEventListener('blur', finishEdit);
            el.removeEventListener('keydown', handleKey);
        };

        const handleKey = (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                el.blur();
            }
            if (e.key === 'Escape') {
                el.textContent = originalText;
                el.blur();
            }
        };

        el.addEventListener('blur', finishEdit);
        el.addEventListener('keydown', handleKey);
    }

    async function saveTopicEdit(dayNum, topic) {
        try {
            await sb.from('daily_progress').upsert(
                { day_number: dayNum, topic: topic, status: getStatusForDay(dayNum) },
                { onConflict: 'day_number' }
            );
        } catch (e) { console.error('saveTopicEdit error:', e); }
    }

    function getStatusForDay(dayNum) {
        const prog = dailyProgress.find(d => d.day_number === dayNum);
        return prog ? prog.status : 'pending';
    }

    // ================================================================
    // SAVE DAY DATE MAPPING (after drag)
    // ================================================================
    async function saveDayDateMapping(dayNum, dateStr) {
        try {
            const existing = dailyProgress.find(d => d.day_number === dayNum);
            const topic = existing ? existing.topic : (INITIAL_REVIEW_DAYS[dayNum] ? INITIAL_REVIEW_DAYS[dayNum].topic : '');
            const status = existing ? existing.status : 'pending';
            await sb.from('daily_progress').upsert(
                { day_number: dayNum, topic, status, notes: 'date:' + dateStr },
                { onConflict: 'day_number' }
            );
        } catch (e) { console.error('saveDayDateMapping error:', e); }
    }

    // ================================================================
    // STATUS POPOVER
    // ================================================================
    function showStatusPopover(event, dayNumber, topic, currentStatus) {
        const popover = document.getElementById('statusPopover');
        const statuses = ['pending', 'in_progress', 'completed'];
        const labels = { pending: '待开始', in_progress: '进行中', completed: '已完成' };
        const icons = { pending: '\u25CB', in_progress: '\u2192', completed: '\u2713' };

        let html = `<div style="padding:.3rem .5rem;font-size:.75rem;color:var(--text-dim);border-bottom:1px solid var(--border);margin-bottom:.25rem">Day ${dayNumber}</div>`;
        statuses.forEach(s => {
            const active = s === currentStatus ? ' style="color:var(--accent-light);font-weight:600"' : '';
            html += `<button data-status="${s}"${active}>${icons[s]} ${labels[s]}</button>`;
        });
        popover.innerHTML = html;

        const rect = event.currentTarget.getBoundingClientRect();
        let top = rect.bottom + 4;
        let left = rect.left;
        if (top + 160 > window.innerHeight) top = rect.top - 160;
        if (left + 150 > window.innerWidth) left = window.innerWidth - 160;
        popover.style.top = top + 'px';
        popover.style.left = left + 'px';
        popover.classList.add('show');

        popover.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const newStatus = btn.dataset.status;
                popover.classList.remove('show');
                await markDay(dayNumber, newStatus);
            });
        });
    }

    document.addEventListener('click', (e) => {
        const popover = document.getElementById('statusPopover');
        if (!e.target.closest('.cal-cell') && !e.target.closest('.status-popover')) {
            popover.classList.remove('show');
        }
        const assessPopup = document.getElementById('assessPopup');
        if (!e.target.closest('.selfeval-bar') && !e.target.closest('.assess-popup')) {
            assessPopup.classList.remove('show');
        }
        // Close heatmap count popup if clicking outside
        if (!e.target.closest('.hm-clickable-count') && !e.target.closest('.hm-count-popup')) {
            closeHeatmapPopup();
        }
    });

    async function markDay(dayNum, status) {
        const reviewInfo = INITIAL_REVIEW_DAYS[dayNum];
        const existing = dailyProgress.find(d => d.day_number === dayNum);
        // Preserve existing topic (may be JSON task array) instead of overwriting
        const topic = (existing && existing.topic) ? existing.topic : (reviewInfo ? reviewInfo.topic : '');
        const dateStr = reviewDayDateMap[dayNum] || '';
        try {
            await sb.from('daily_progress').upsert(
                { day_number: dayNum, topic, status, notes: dateStr ? 'date:' + dateStr : '' },
                { onConflict: 'day_number' }
            );
            const existingIdx = dailyProgress.findIndex(d => d.day_number === dayNum);
            if (existingIdx >= 0) {
                dailyProgress[existingIdx].status = status;
                dailyProgress[existingIdx].topic = topic;
            } else {
                dailyProgress.push({ day_number: dayNum, topic, status, notes: dateStr ? 'date:' + dateStr : '' });
            }
            renderCalendar();
            renderStats();
            renderCountdown();
        } catch (e) { console.error('markDay error:', e); }
    }

    // ================================================================
    // KNOWLEDGE MODULE CARDS
    // ================================================================
    function renderModules() {
        const grid = document.getElementById('modulesGrid');
        grid.innerHTML = '';

        Object.entries(KB).forEach(([key, mod]) => {
            const card = document.createElement('div');
            card.className = 'mod-card';

            let totalAssessed = 0, totalMastered = 0;
            const pointRows = mod.points.map(p => {
                const assessments = allAssessments.filter(a => a.point_id === p.id);
                const mastered = assessments.filter(a => a.status === 'mastered').length;
                const partial = assessments.filter(a => a.status === 'partial').length;
                const notM = assessments.filter(a => a.status === 'not_mastered').length;
                const total = assessments.length;
                totalAssessed += total;
                totalMastered += mastered;

                // Collect student names per category
                const gStudents = [], yStudents = [], rStudents = [];
                assessments.forEach(a => {
                    const student = students.find(s => s.id === a.student_id);
                    const name = student ? student.name : '未知';
                    if (a.status === 'mastered') gStudents.push(name);
                    else if (a.status === 'partial') yStudents.push(name);
                    else rStudents.push(name);
                });

                return { ...p, mastered, partial, notM, total, gStudents, yStudents, rStudents };
            });

            // Progress: mastery rate among assessed students
            const masteryRate = totalAssessed > 0 ? Math.round(totalMastered / totalAssessed * 100) : 0;
            const barColor = masteryRate > 60 ? 'var(--green)' : masteryRate > 30 ? 'var(--yellow)' : 'var(--red)';

            let tableRows = pointRows.map(p => {
                const wLabel = p.w === 'high' ? '高频' : p.w === 'mid' ? '中频' : '低频';
                const totalBar = p.gStudents.length + p.yStudents.length + p.rStudents.length;
                const gPct = totalBar > 0 ? (p.gStudents.length / totalBar * 100) : 0;
                const yPct = totalBar > 0 ? (p.yStudents.length / totalBar * 100) : 0;
                const rPct = totalBar > 0 ? (p.rStudents.length / totalBar * 100) : 0;

                const barHtml = totalBar > 0
                    ? `<div class="selfeval-bar" data-point-id="${p.id}" data-g='${JSON.stringify(p.gStudents)}' data-y='${JSON.stringify(p.yStudents)}' data-r='${JSON.stringify(p.rStudents)}'>
                         <div class="seg seg-g" style="width:${gPct}%"></div>
                         <div class="seg seg-y" style="width:${yPct}%"></div>
                         <div class="seg seg-r" style="width:${rPct}%"></div>
                       </div>
                       <span class="selfeval-bar-label">${p.total}人已评</span>`
                    : `<span style="color:var(--text-dim);font-size:.78rem">暂无评估</span>`;

                return `<tr>
                    <td>${p.id} ${escapeHtml(p.name)} <span class="w-${p.w}" style="font-size:.7rem">[${wLabel}]</span></td>
                    <td>${barHtml}</td>
                    <td style="font-size:.72rem">${(() => {
                        const qEntries = pointToQuiz[p.id];
                        if (!qEntries || !qEntries.length) return '<span style="color:var(--text-dim);font-size:.65rem;">暂无练习</span>';
                        const rates = [];
                        qEntries.forEach(e => {
                            const r = getQuestionCorrectRate(e._quiz, e.q);
                            if (r !== null) rates.push(r);
                        });
                        if (!rates.length) return '<span style="color:var(--text-dim);font-size:.65rem;">暂无数据</span>';
                        const avg = Math.round(rates.reduce((a,b)=>a+b,0)/rates.length);
                        const mn = Math.min(...rates);
                        const cnt = rates.length;
                        const c = avg >= 80 ? 'var(--green)' : avg >= 60 ? 'var(--yellow)' : 'var(--red)';
                        const barW = Math.max(8, avg);
                        let badge = '';
                        if (cnt >= 3) badge += '<span style="background:rgba(99,102,241,.15);color:var(--accent-light);font-size:.55rem;padding:1px 4px;border-radius:2px;margin-left:3px;">高频</span>';
                        if (mn < 60) badge += '<span style="background:rgba(239,68,68,.12);color:var(--red);font-size:.55rem;padding:1px 4px;border-radius:2px;margin-left:3px;">难点</span>';
                        return '<div style="display:flex;align-items:center;gap:6px;">' +
                            '<span style="font-weight:600;color:' + c + ';min-width:32px;">' + avg + '%</span>' +
                            '<div style="flex:1;height:6px;background:var(--border);border-radius:3px;min-width:30px;max-width:60px;"><div style="width:' + barW + '%;height:100%;background:' + c + ';border-radius:3px;"></div></div>' +
                            '<span style="color:var(--text-dim);font-size:.6rem;white-space:nowrap;">' + cnt + '次</span>' +
                            badge + '</div>';
                    })()}</td>
                </tr>`;
            }).join('');

            card.innerHTML = `
                <div class="mod-head">
                    <div class="mod-info">
                        <div class="mod-name">${key}. ${mod.name}</div>
                        <div class="mod-meta">权重 ${mod.weight}% | ${mod.points.length} 个知识点 | 掌握率 ${masteryRate}% (${totalAssessed}人已评)${(() => { const qc = moduleQuizSummary[mod.name] || 0; if (!qc) return ''; const avgR = getAggModuleAvgCorrectRate(mod.name); return ' | 练习' + qc + '题' + (avgR !== null ? ' 均正确率' + avgR + '%' : ''); })()}</div>
                    </div>
                    <div class="mod-right">
                        <div class="mod-bar"><div class="mod-bar-fill" style="width:${masteryRate}%;background:${barColor}"></div></div>
                        <span class="mod-pct" style="color:${barColor}">${masteryRate}%</span>
                        <span class="mod-expand">\u25BC</span>
                    </div>
                </div>
                <div class="mod-body">
                    <table class="mod-table">
                        <thead><tr><th>知识点</th><th>学生自评</th><th>复习情况</th></tr></thead>
                        <tbody>${tableRows}</tbody>
                    </table>
                </div>`;

            card.querySelector('.mod-head').addEventListener('click', () => {
                card.classList.toggle('expanded');
            });

            // Self-eval bar click -> show popup
            card.querySelectorAll('.selfeval-bar').forEach(bar => {
                bar.addEventListener('click', (e) => {
                    e.stopPropagation();
                    showAssessPopup(e, bar);
                });
            });

            grid.appendChild(card);
        });
    }

    // ================================================================
    // ASSESSMENT POPUP (shows which students in each category)
    // ================================================================

            <div class="cat-title"><span class="dot" style="background:var(--green)"></span> 满分拿下 (${gStudents.length}人)</div>
            <div>${gStudents.length > 0 ? gStudents.map(n => `<span class="student-chip">${escapeHtml(n)}</span>`).join('') : '<span style="color:var(--text-dim);font-size:.78rem">暂无</span>'}</div>
        </div>`;

            <div class="cat-title"><span class="dot" style="background:var(--yellow)"></span> 加强练习 (${yStudents.length}人)</div>

        </div>`;
        html += `<div class="cat-group">
            <div class="cat-title"><span class="dot" style="background:var(--red)"></span> 有点挑战 (${rStudents.length}人)</div>
            <div>${rStudents.length > 0 ? rStudents.map(n => `<span class="student-chip">${escapeHtml(n)}</span>`).join('') : '<span style="color:var(--text-dim);font-size:.78rem">暂无</span>'}</div>

        if (top + 300 > window.innerHeight) top = Math.max(10, rect.top - 300);
        if (left + 360 > window.innerWidth) left = Math.max(10, window.innerWidth - 370);
        popup.style.top = top + 'px';
        popup.style.left = left + 'px';
        popup.classList.add('show');
    }

    // ================================================================
    // HEATMAP (redesigned: level-1 summary + level-2 expand, sorted)
    // ================================================================
    function renderHeatmap() {
        const container = document.getElementById('heatmapContainer');
        if (students.length === 0) {
            container.innerHTML = '<div style="color:var(--text-dim);padding:1rem;">暂无学生注册</div>';
            return;
        }

        // Compute stats per point
        const pointStats = {};
        ALL_POINTS.forEach(p => {
            const assessments = allAssessments.filter(a => a.point_id === p.id);
            const mastered = assessments.filter(a => a.status === 'mastered').length;
            const partial = assessments.filter(a => a.status === 'partial').length;
            const notM = assessments.filter(a => a.status === 'not_mastered').length;
            const total = assessments.length;
            const unassessed = Math.max(0, students.length - total);
            const challengeRate = total > 0 ? (notM / total * 100) : 0;
            pointStats[p.id] = { ...p, mastered, partial, notM, total, unassessed, challengeRate };
        });

        // Sort modules: F first, then by average challenge rate descending
        const moduleKeys = Object.keys(KB);
        const moduleOrder = [...moduleKeys].sort((a, b) => {
            if (a === 'F') return -1;
            if (b === 'F') return 1;
            const avgChalA = getModuleAvgChallenge(a, pointStats);
            const avgChalB = getModuleAvgChallenge(b, pointStats);
            return avgChalB - avgChalA;
        });

        let html = `<table class="hm-table">`;
        html += `<thead><tr>
            <th style="text-align:left;width:220px">模块 / 知识点</th>
            <th>掌握</th><th>部分</th><th>挑战</th><th>未评估</th>
            <th>挑战率</th><th>预警</th><th>练习反馈</th>
        </tr></thead><tbody>`;

        moduleOrder.forEach(key => {
            const mod = KB[key];
            const pts = mod.points.map(p => pointStats[p.id]);
            const sumM = pts.reduce((s, p) => s + p.mastered, 0);
            const sumP = pts.reduce((s, p) => s + p.partial, 0);
            const sumN = pts.reduce((s, p) => s + p.notM, 0);
            const sumTotal = pts.reduce((s, p) => s + p.total, 0);
            const sumUnassessed = pts.reduce((s, p) => s + p.unassessed, 0);
            const challengeRate = sumTotal > 0 ? Math.round(sumN / sumTotal * 100) : 0;
            const isWarn = sumTotal >= 3 && challengeRate > 30;

            const modColorClass = challengeRate > 40 ? 'hm-red' : challengeRate > 20 ? 'hm-yellow' : 'hm-green';

            // Aggregate student names at module level for popup
            const modStudents = { mastered: [], partial: [], notM: [], unassessed: [] };
            students.forEach(student => {
                let hasAssessment = false;
                mod.points.forEach(p => {
                    const a = allAssessments.find(a => a.student_id === student.id && a.point_id === p.id);
                    if (a) {
                        hasAssessment = true;
                        if (a.status === 'mastered' && !modStudents.mastered.includes(student.name)) modStudents.mastered.push(student.name);
                        else if (a.status === 'partial' && !modStudents.partial.includes(student.name)) modStudents.partial.push(student.name);
                        else if (a.status === 'not_mastered' && !modStudents.notM.includes(student.name)) modStudents.notM.push(student.name);
                    }
                });
                if (!hasAssessment) modStudents.unassessed.push(student.name);
            });

            html += `<tr class="hm-module" data-module="${key}">
                <td class="hm-name" style="font-weight:600">${key}. ${mod.name} (${mod.points.length}个知识点)</td>
                <td class="hm-green"><span class="hm-clickable-count" data-cat="mastered" data-students="${escapeHtml(modStudents.mastered.join(', '))}" style="cursor:pointer;text-decoration:underline dotted;">${sumM}</span></td>
                <td class="hm-yellow"><span class="hm-clickable-count" data-cat="partial" data-students="${escapeHtml(modStudents.partial.join(', '))}" style="cursor:pointer;text-decoration:underline dotted;">${sumP}</span></td>
                <td class="${sumN > 0 ? 'hm-red' : 'hm-gray'}"><span class="hm-clickable-count" data-cat="notM" data-students="${escapeHtml(modStudents.notM.join(', '))}" style="cursor:pointer;text-decoration:underline dotted;">${sumN}</span></td>
                <td class="hm-gray"><span class="hm-clickable-count" data-cat="unassessed" data-students="${escapeHtml(modStudents.unassessed.join(', '))}" style="cursor:pointer;text-decoration:underline dotted;">${sumUnassessed}</span></td>
                <td class="${modColorClass}">${challengeRate}%</td>
                <td class="${isWarn ? 'hm-red' : ''}">${isWarn ? '\u26A0' : '-'}</td>
                <td class="hm-gray" style="font-size:.7rem">${(() => {
                    const qCount = moduleQuizSummary[mod.name] || 0;
                    if (qCount > 0) {
                        const avgRate = getAggModuleAvgCorrectRate(mod.name);
                        const rateStr = avgRate !== null ? '均正确率' + avgRate + '%' : '';
                        const quizLinks = ALL_QUIZZES.filter(quiz => {
                            const ms = getModuleQuizSummaryForQuiz(quiz);
                            return (ms[mod.name] || 0) > 0;
                        }).map(quiz => {
                            const ms = getModuleQuizSummaryForQuiz(quiz);
                            const qc = ms[mod.name] || 0;
                            const qAvgRate = getModuleAvgCorrectRate(quiz, mod.name);
                            const qRateStr = qAvgRate !== null ? qAvgRate + '%' : '?';
                            const shortName = quiz.name.replace('滚动练习', '');
                            return '<span class="hm-quiz-link" data-quiz-name="' + escapeHtml(quiz.name) + '" data-quiz-module="' + escapeHtml(mod.name) + '" style="cursor:pointer;color:var(--yellow);text-decoration:underline;font-size:.63rem;margin-right:4px;" title="' + escapeHtml(quiz.name) + ': ' + mod.name + qc + '题 正确率' + qRateStr + '">' + shortName + ': ' + mod.name + qc + '题 ' + qRateStr + '</span>';
                        }).join('<br>');
                        return quizLinks;
                    }
                    return '<span style="color:var(--text-dim);font-size:.65rem;">暂无练习</span>';
                })()}</td>
            </tr>`;

            // Sort points: highest challenge rate first
            const sortedPoints = [...pts].sort((a, b) => b.challengeRate - a.challengeRate);
            sortedPoints.forEach(p => {
                const pColorClass = p.challengeRate > 40 ? 'hm-red' : p.challengeRate > 20 ? 'hm-yellow' : 'hm-green';
                const isPW = p.total >= 3 && p.challengeRate > 30;
                const displayName = p.name.length > 18 ? p.name.substring(0, 18) + '...' : p.name;

                // Compute student names per status for tooltip
                const ptStudents = { mastered: [], partial: [], notM: [], unassessed: [] };
                students.forEach(student => {
                    const assessment = allAssessments.find(a => a.student_id === student.id && a.point_id === p.id);
                    if (!assessment) {
                        ptStudents.unassessed.push(student.name);
                    } else if (assessment.status === 'mastered') {
                        ptStudents.mastered.push(student.name);
                    } else if (assessment.status === 'partial') {
                        ptStudents.partial.push(student.name);
                    } else {
                        ptStudents.notM.push(student.name);
                    }
                });

                html += `<tr class="hm-point" data-module="${key}">
                    <td class="hm-name" style="padding-left:2rem;font-size:.76rem">${p.id} ${escapeHtml(displayName)}</td>
                    <td class="hm-green"><span class="hm-clickable-count" data-cat="mastered" data-students="${escapeHtml(ptStudents.mastered.join(', '))}" style="cursor:pointer;text-decoration:underline dotted;">${p.mastered}</span></td>
                    <td class="hm-yellow"><span class="hm-clickable-count" data-cat="partial" data-students="${escapeHtml(ptStudents.partial.join(', '))}" style="cursor:pointer;text-decoration:underline dotted;">${p.partial}</span></td>
                    <td class="${p.notM > 0 ? 'hm-red' : 'hm-gray'}"><span class="hm-clickable-count" data-cat="notM" data-students="${escapeHtml(ptStudents.notM.join(', '))}" style="cursor:pointer;text-decoration:underline dotted;">${p.notM}</span></td>
                    <td class="hm-gray"><span class="hm-clickable-count" data-cat="unassessed" data-students="${escapeHtml(ptStudents.unassessed.join(', '))}" style="cursor:pointer;text-decoration:underline dotted;">${p.unassessed}</span></td>
                    <td class="${pColorClass}">${Math.round(p.challengeRate)}%</td>
                    <td class="${isPW ? 'hm-red' : ''}">${isPW ? '!!' : '-'}</td>
                    <td class="hm-gray" style="font-size:.7rem">${(() => {
                        const quizEntries = pointToQuiz[p.id];
                        if (quizEntries && quizEntries.length > 0) {
                            // Group by quiz
                            const byQuiz = {};
                            quizEntries.forEach(entry => {
                                const quiz = entry._quiz;
                                if (!byQuiz[quiz.name]) byQuiz[quiz.name] = { quiz: quiz, questions: [] };
                                byQuiz[quiz.name].questions.push(entry);
                            });
                            let linksHtml = '';
                            Object.values(byQuiz).forEach(({quiz, questions}) => {
                                const qDetails = questions.map(q => {
                                    const rate = getQuestionCorrectRate(quiz, q.q);
                                    if (rate === null) return 'Q' + q.q + ': —';
                                    const c = rate >= 70 ? 'var(--green)' : rate >= 50 ? 'var(--yellow)' : 'var(--red)';
                                    return '<span style="color:' + c + '">Q' + q.q + ':' + rate + '%</span>';
                                }).join(' ');
                                const shortName = quiz.name.replace('滚动练习', '');
                                linksHtml += '<span class="hm-quiz-link" data-quiz-name="' + escapeHtml(quiz.name) + '" data-quiz-point="' + p.id + '" style="cursor:pointer;color:var(--yellow);text-decoration:underline;font-size:.63rem;display:inline-block;margin-right:4px;" title="' + questions.map(q => 'Q' + q.q + '(' + q.topic + ')').join(', ') + '">' + shortName + ' ' + qDetails + '</span> ';
                            });
                            return linksHtml || '<span style="font-size:.65rem;color:var(--text-dim);">暂无练习</span>';
                        }
                        return '<span style="font-size:.65rem;color:var(--text-dim);">暂无练习</span>';
                    })()}</td>
                </tr>`;
            });
        });

        html += '</tbody></table>';
        container.innerHTML = html;

        // Click to expand module rows (but not when clicking counts or quiz links)
        container.querySelectorAll('tr.hm-module').forEach(row => {
            row.addEventListener('click', (e) => {
                if (e.target.closest('.hm-clickable-count') || e.target.closest('.hm-quiz-link')) return;
                const mod = row.dataset.module;
                const points = container.querySelectorAll(`tr.hm-point[data-module="${mod}"]`);
                points.forEach(p => p.classList.toggle('visible'));
            });
        });

        // Clickable count popups
        container.querySelectorAll('.hm-clickable-count').forEach(span => {
            span.addEventListener('click', (e) => {
                e.stopPropagation();
                closeHeatmapPopup();
                const cat = span.dataset.cat;
                const studentNames = (span.dataset.students || '').split(', ').filter(n => n);
                const catLabels = { mastered: '掌握', partial: '部分掌握', notM: '有挑战', unassessed: '未评估' };
                const catColors = { mastered: 'var(--green)', partial: 'var(--yellow)', notM: 'var(--red)', unassessed: 'var(--text-dim)' };

                const popup = document.createElement('div');
                popup.className = 'hm-count-popup';
                popup.id = 'hmCountPopup';
                let popupHtml = `<div class="popup-title" style="color:${catColors[cat]}">${catLabels[cat]} (${studentNames.length}人)</div>`;
                if (studentNames.length > 0) {
                    popupHtml += studentNames.map(n => `<span class="popup-chip hm-student-link" data-student-name="${escapeHtml(n)}" style="cursor:pointer">${escapeHtml(n)}</span>`).join('');
                } else {
                    popupHtml += '<span style="color:var(--text-dim)">暂无</span>';
                }
                popup.innerHTML = popupHtml;
                document.body.appendChild(popup);

                const rect = span.getBoundingClientRect();
                let top = rect.bottom + 4;
                let left = rect.left;
                if (top + 200 > window.innerHeight) top = Math.max(10, rect.top - 200);
                if (left + 320 > window.innerWidth) left = Math.max(10, window.innerWidth - 330);
                popup.style.top = top + 'px';
                popup.style.left = left + 'px';

                setTimeout(() => {
                    document.addEventListener('click', closeHeatmapPopup, { once: true });
                }, 10);
            });
        });

        // Clickable quiz name links -> open quiz detail modal
        container.querySelectorAll('.hm-quiz-link').forEach(span => {
            span.addEventListener('click', (e) => {
                e.stopPropagation();
                const quizName = span.dataset.quizName;
                const quiz = ALL_QUIZZES.find(q => q.name === quizName);
                if (!quiz) return;

                // Determine which point/module this was clicked from
                const moduleId = span.dataset.quizModule;
                const pointId = span.dataset.quizPoint;

                showQuizDetailModal(quiz, moduleId, pointId);
            });
        });

        // Clickable student names in heatmap popups -> open student detail
        document.body.addEventListener('click', (e) => {
            const link = e.target.closest('.hm-student-link');
            if (link) {
                e.stopPropagation();
                closeHeatmapPopup();
                const name = link.dataset.studentName;
                const student = students.find(s => s.name === name);
                if (student) showStudentDetail(student.id);
            }
        });
    }

    function showQuizDetailModal(quiz, filterModuleName, filterPointId) {
        const modal = document.getElementById('quizDetailModal');
        const content = document.getElementById('quizDetailModalContent');

        let filteredQuestions = quiz.questions;
        if (filterModuleName) {
            filteredQuestions = quiz.questions.filter(q => q.module === filterModuleName);
        } else if (filterPointId) {
            filteredQuestions = quiz.questions.filter(q => q.points.includes(filterPointId));
        }

        let html = `<button class="qdm-close" id="qdmCloseBtn">&times;</button>`;
        html += `<h2>${escapeHtml(quiz.name)}</h2>`;
        html += `<div class="qdm-date">${quiz.date} | 共${quiz.questions.length}题 | 满分${quiz.total}分</div>`;

        html += `<table class="qdm-table"><thead><tr>
            <th>题号</th><th>题型</th><th>考点</th><th>正确答案</th><th>错误率</th><th>错误学生</th>
        </tr></thead><tbody>`;

        filteredQuestions.forEach(q => {
            const wrongStudents = [];
            const scoreEntries = Object.entries(quiz.scores);
            scoreEntries.forEach(([name, scoreData]) => {
                const sq = scoreData.questions.find(sq => sq.q === q.q);
                if (sq && sq.score < 5) {
                    wrongStudents.push(name);
                }
            });

            const totalStudents = scoreEntries.length;
            const errorRate = totalStudents > 0 ? Math.round(wrongStudents.length / totalStudents * 100) : 0;
            const erColor = errorRate >= 40 ? 'var(--red)' : errorRate >= 20 ? 'var(--yellow)' : 'var(--green)';
            const rowBg = errorRate >= 20 ? 'background:rgba(239,68,68,0.04);' : '';

            const wrongHtml = wrongStudents.length > 0
                ? `<span class="qdm-wrong-students">${wrongStudents.map(n => escapeHtml(n)).join(', ')}</span>`
                : '<span style="color:var(--green);font-size:.72rem">全部正确</span>';

            html += `<tr style="${rowBg}">
                <td>Q${q.q}</td>
                <td>${q.type}</td>
                <td style="font-size:.75rem">${escapeHtml(q.topic)}</td>
                <td style="font-weight:600;color:var(--green)">${escapeHtml(String(q.answer))}</td>
                <td style="font-weight:600;color:${erColor}">${errorRate}%</td>
                <td>${wrongHtml}</td>
            </tr>`;
        });

        html += `</tbody></table>`;
        content.innerHTML = html;
        modal.classList.add('show');

        document.getElementById('qdmCloseBtn').addEventListener('click', closeQuizDetailModal);
    }
