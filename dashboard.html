    function renderStudentList() {
        const grid = document.getElementById('studentGrid');
        if (students.length === 0) {
            grid.innerHTML = '<div style="color:var(--text-dim);padding:1rem;">暂无学生注册</div>';
            return;
        }

        const classFilter = document.getElementById('classFilter').value;
        const search = document.getElementById('studentSearch').value.trim().toLowerCase();

        let filtered = students;
        if (classFilter) filtered = filtered.filter(s => s.class_name === classFilter);
        if (search) filtered = filtered.filter(s => s.name.toLowerCase().includes(search));

        // Compute homework stats for all students
        const hwStats = computeHomeworkStats();

        // Compute class averages for warning detection
        const allScoreValues = Object.values(STUDENT_SCORES);
        const allFm = allScoreValues.filter(s => s.fm).map(s => s.fm);
        const avgFm = allFm.length > 0 ? allFm.reduce((a, b) => a + b, 0) / allFm.length : 0;
        const allFt = allScoreValues.filter(s => s.ft).map(s => s.ft);
        const avgFt = allFt.length > 0 ? allFt.reduce((a, b) => a + b, 0) / allFt.length : 0;
        const allMm = allScoreValues.filter(s => s.mm).map(s => s.mm);
        const avgMm = allMm.length > 0 ? allMm.reduce((a, b) => a + b, 0) / allMm.length : 0;
        const allMt = allScoreValues.filter(s => s.mt).map(s => s.mt);
        const avgMt = allMt.length > 0 ? allMt.reduce((a, b) => a + b, 0) / allMt.length : 0;

        // Determine warning level for each student and sort by priority
        const getWarningLevel = (s) => {
            // Priority students always come first
            const isPriority = teacherData.priority.includes(s.id);
            const sd = STUDENT_SCORES[s.name];
            if (sd) {
                if (sd.ft && sd.ft > avgFt && sd.fm && sd.fm < avgFm) return isPriority ? 0 : 1;
                if (sd.mt && sd.mt > avgMt && sd.mm && sd.mm < avgMm) return isPriority ? 0 : 1;
            }
            const hw = hwStats[s.name];
            let hasQuizWarning = false;
            ALL_QUIZZES.filter(q => !q.status).forEach(quiz => {
                const quizScore = quiz.scores[s.name];
                if (!quizScore || quizScore.total < 55) hasQuizWarning = true;
            });
            // Homework warning: unsubmitted or low scores
            if (hw && (hw.notSubmitted > 0 || hw.lowScores >= 2)) hasQuizWarning = true;
            if (hasQuizWarning) return isPriority ? 0 : 2;
            return isPriority ? 0 : 3;
        };

        filtered.sort((a, b) => getWarningLevel(a) - getWarningLevel(b));

        grid.innerHTML = filtered.map(s => {
            const assessments = allAssessments.filter(a => a.student_id === s.id);
            const g = assessments.filter(a => a.status === 'mastered').length;
            const y = assessments.filter(a => a.status === 'partial').length;
            const r = assessments.filter(a => a.status === 'not_mastered').length;
            const total = ALL_POINTS.length;

            const scoreData = STUDENT_SCORES[s.name];
            const target = scoreData ? scoreData.fm : '--';
            const prediction = computeStudentPrediction(s.id);
            const isPriority = teacherData.priority.includes(s.id);
            const hw = hwStats[s.name] || {};

            const warningLevel = getWarningLevel(s);
            let cardStyle = '';
            let badges = '';
            if (isPriority) {
                cardStyle += 'border-left:3px solid var(--accent-light);';
                badges += '<span style="font-size:.6rem;color:var(--accent-light);background:rgba(99,102,241,.12);padding:1px 5px;border-radius:3px;margin-left:4px;">★ 重点</span>';
            }
            if (warningLevel === 1 || warningLevel === 0) {
                if (!isPriority) cardStyle += 'border-left:3px solid var(--red);box-shadow:0 0 8px rgba(239,68,68,0.3);';
                badges += '<span style="font-size:.6rem;color:var(--red);background:rgba(239,68,68,.1);padding:1px 5px;border-radius:3px;margin-left:4px;">数学薄弱</span>';
            } else if (warningLevel === 2) {
                if (!isPriority) cardStyle += 'border-left:3px solid var(--yellow);';
                badges += '<span style="font-size:.6rem;color:var(--yellow);background:rgba(245,158,11,.1);padding:1px 5px;border-radius:3px;margin-left:4px;">预警</span>';
            }
            // Homework warning badge
            if (hw.notSubmitted > 0) {
                badges += '<span style="font-size:.6rem;color:var(--red);background:rgba(239,68,68,.08);padding:1px 5px;border-radius:3px;margin-left:4px;">未交' + hw.notSubmitted + '次</span>';
            } else if (hw.lowScores >= 2) {
                badges += '<span style="font-size:.6rem;color:var(--yellow);background:rgba(245,158,11,.08);padding:1px 5px;border-radius:3px;margin-left:4px;">低分' + hw.lowScores + '次</span>';
            }
            // Teacher note indicator
            if (teacherData.notes[s.id]) {
                badges += '<span style="font-size:.6rem;color:var(--text-dim);background:rgba(107,114,128,.1);padding:1px 5px;border-radius:3px;margin-left:4px;" title="' + escapeHtml(teacherData.notes[s.id].substring(0, 50)) + '">✎ 备注</span>';
            }

            return `<div class="student-card" data-sid="${s.id}" style="${cardStyle}">
                <div class="sc-name">${escapeHtml(s.name)}${badges}</div>
                <div class="sc-class">${escapeHtml(s.class_name)}</div>
                <div class="sc-target">目标: ${target}分 | 预测: ${prediction}分</div>
                <div class="sc-stats">
                    <span class="sc-stat"><span class="sc-dot" style="background:var(--green)"></span>${g}</span>
                    <span class="sc-stat"><span class="sc-dot" style="background:var(--yellow)"></span>${y}</span>
                    <span class="sc-stat"><span class="sc-dot" style="background:var(--red)"></span>${r}</span>
                    <span class="sc-stat" style="color:var(--text-dim)">/${total}</span>
                    <span style="font-size:.65rem;color:var(--text-dim);margin-left:6px;">交${hw.submitted || 0}/${hw.totalQuizzes || 0}</span>
                </div>
            </div>`;
        }).join('');

        grid.querySelectorAll('.student-card').forEach(card => {
            card.addEventListener('click', () => showStudentDetail(card.dataset.sid));
        });
    }

    // ================================================================
    // SCORE PREDICTION
    // ================================================================
    function computeStudentPrediction(studentId) {
        const studentAssessments = allAssessments.filter(a => a.student_id === studentId);
        const aMap = {};
        studentAssessments.forEach(a => { aMap[a.point_id] = a.status; });

        let totalScore = 0;
        Object.entries(KB).forEach(([key, mod]) => {
            const moduleWeight = MODULE_SCORE_WEIGHTS[key] || 0;
            let moduleRate = 0;
            let assessedCount = 0;
            let moduleScore = 0;

            mod.points.forEach(p => {
                const status = aMap[p.id];
                if (status) {
                    assessedCount++;
                    moduleScore += (STATUS_SCORE[status] || UNASSESSED_SCORE);
                } else {
                    moduleScore += UNASSESSED_SCORE;
                }
            });

            moduleRate = mod.points.length > 0 ? moduleScore / mod.points.length : UNASSESSED_SCORE;
            totalScore += moduleWeight * moduleRate;
        });

        return Math.round(totalScore);
    }

            html += `<tr><td>高一上期末</td><td>${scoreData.fm}/150</td><td>第${scoreData.fmr}名</td></tr>`;
            if (scoreData.mm !== null && scoreData.mm !== undefined) {
                html += `<tr><td>高一下5月月考</td><td>${scoreData.mm}/100</td><td>第${scoreData.mmr}名</td></tr>`;
            }
            html += `</tbody></table>`;
        } else {
            html += `<div class="sd-empty">暂无历史成绩数据</div>`;
        }
        html += `</div>`;

        // Review plans
        html += `<div class="sd-section"><h3>复习计划</h3>`;
        if (studentPlans.length > 0) {
            studentPlans.forEach(plan => {
                const dateStr = plan.plan_date ? new Date(plan.plan_date).toLocaleDateString('zh-CN') : '未知日期';
                html += `<div class="sd-plan-item"><div class="plan-date">${dateStr}</div>${escapeHtml(plan.content)}</div>`;
            });
        } else {
            html += `<div class="sd-empty">暂无复习计划</div>`;
        }
        html += `</div>`;

        // Quiz scores section - iterate over all quizzes
        ALL_QUIZZES.filter(q => !q.status).forEach(quiz => {
            const studentQuiz = quiz.scores[student.name];
            if (studentQuiz) {
                html += `<div class="sd-section">
                    <h3>📝 小测成绩 (${quiz.name})</h3>
                    <div style="font-size:1.3rem;font-weight:700;margin:.5rem 0;color:${studentQuiz.total >= 60 ? 'var(--green)' : studentQuiz.total >= 50 ? 'var(--yellow)' : 'var(--red)'}">
                        ${studentQuiz.total} / ${quiz.total}
                    </div>
                    <table style="width:100%;font-size:.78rem;border-collapse:collapse;">
                        <tr style="color:var(--text-dim);border-bottom:1px solid var(--border);">
                            <th style="text-align:left;padding:4px;">题号</th><th>得分</th><th>正确答案</th><th>考点</th>
                        </tr>
                        ${studentQuiz.questions.map(sq => {
                            const qInfo = quiz.questions.find(q => q.q === sq.q);
                            const isCorrect = sq.score === 5;
                            return `<tr style="border-bottom:1px solid rgba(42,47,69,.4);">
                                <td style="padding:4px;">Q${sq.q}</td>
                                <td style="text-align:center;color:${isCorrect ? 'var(--green)' : 'var(--red)'};font-weight:600;">${sq.score}/5</td>
                                <td style="text-align:center;">${qInfo ? qInfo.answer : '-'}</td>
                                <td style="font-size:.7rem;color:var(--text-dim);">${qInfo ? qInfo.topic : '-'}</td>
                            </tr>`;
                        }).join('')}
                    </table>
                </div>`;
            } else {
                const isSubmitted = quiz.submitted.includes(student.name);
                html += `<div class="sd-section">
                    <h3>📝 小测成绩 (${quiz.name})</h3>
                    <div style="color:var(--text-dim);font-size:.85rem;">${isSubmitted ? '已交卷，成绩待录入' : '未交卷'}</div>
                </div>`;
            }
        });

        content.innerHTML = html;
        overlay.classList.add('show');

        document.getElementById('sdCloseBtn').addEventListener('click', closeStudentDetail);

        // Teacher dropdown handlers
        content.querySelectorAll('.sd-teacher-select').forEach(sel => {
            sel.addEventListener('change', async (e) => {
                const pid = sel.dataset.pid;
                const sid = sel.dataset.sid;
                const newStatus = sel.value;
                try {
                    if (newStatus) {
                        await sb.from('self_assessments').upsert({
                            student_id: sid, point_id: pid,
                            status: newStatus, note: ''
                        }, { onConflict: 'student_id,point_id' });
                        // Update local data
                        const existing = allAssessments.findIndex(a => a.student_id === sid && a.point_id === pid);
                        if (existing >= 0) allAssessments[existing].status = newStatus;
                        else allAssessments.push({ student_id: sid, point_id: pid, status: newStatus, note: '' });
                    }
                } catch (err) {
                    alert('保存失败: ' + err.message);
                }
            });
        });

        // Priority toggle handler
        document.getElementById('sdPriorityBtn').addEventListener('click', async (e) => {
            e.stopPropagation();
            const idx = teacherData.priority.indexOf(studentId);
            if (idx >= 0) teacherData.priority.splice(idx, 1);
            else teacherData.priority.push(studentId);
            const btn = document.getElementById('sdPriorityBtn');
            const isNow = teacherData.priority.includes(studentId);
            btn.className = 'sd-priority-btn' + (isNow ? ' active' : '');
            btn.innerHTML = (isNow ? '★' : '☆') + ' 重点';
            await saveTeacherData();
        });

        // Save teacher note handler
        document.getElementById('sdSaveNoteBtn').addEventListener('click', async () => {
            const noteVal = document.getElementById('sdTeacherNote').value;
            teacherData.notes[studentId] = noteVal;
            await saveTeacherData();
            document.getElementById('sdSaveNoteBtn').textContent = '已保存';
            setTimeout(() => { document.getElementById('sdSaveNoteBtn').textContent = '保存备注'; }, 1500);
        });

        // Password reset button handler
        document.getElementById('sdResetBtn').addEventListener('click', async (e) => {
            e.stopPropagation();
            if (!confirm('确定将该同学的密码重置为1234吗？')) return;
            try {
                let updatePayload = { pin: '1234' };
                try {
                    updatePayload.first_login_done = false;
                    await sb.from('students').update(updatePayload).eq('id', studentId);
                } catch (_) {
                    await sb.from('students').update({ pin: '1234' }).eq('id', studentId);
                }
                alert('密码已重置为1234，该同学下次登录时需修改密码。');
            } catch (err) {
                alert('重置密码失败: ' + err.message);
            }
        });
    }

    function closeStudentDetail() {
        document.getElementById('studentDetailOverlay').classList.remove('show');
    }

    document.getElementById('studentDetailOverlay').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) closeStudentDetail();
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            closeStudentDetail();
            closeQuizDetailModal();
            closeHeatmapPopup();
            document.getElementById('assessPopup').classList.remove('show');
        }
    });

    // ================================================================
    // TIPS OVERVIEW
    // ================================================================
    async function renderTips() {
        const list = document.getElementById('tipsList');
        if (allTips.length === 0) {
            list.innerHTML = '<div style="color:var(--text-dim);padding:1rem;">暂无温馨提示</div>';
            return;
        }

        // Sort: featured first, then by likes
        const sorted = [...allTips].sort((a, b) => {
            if (a.featured && !b.featured) return -1;
            if (!a.featured && b.featured) return 1;
            return (b.likes || 0) - (a.likes || 0);
        });

        list.innerHTML = sorted.map(tip => {
            const isFeatured = tip.featured;
            const dateStr = tip.created_at ? new Date(tip.created_at).toLocaleDateString('zh-CN') : '';
            return `<div class="tip-card ${isFeatured ? 'featured' : ''}">
                ${isFeatured ? '<span class="tip-featured-badge">精选</span>' : ''}
                <div class="tip-meta">
                    <span class="tip-author">${escapeHtml(tip.student_name)}</span>
                    <span class="tip-point">${escapeHtml(tip.module_name || '')} ${escapeHtml(tip.point_id || '')}</span>
                </div>
                <div class="tip-content">${escapeHtml(tip.content)}</div>
                <div class="tip-footer">
                    <div class="tip-likes">点赞 ${tip.likes || 0}</div>
                    <div class="tip-actions">
                        <button class="tip-btn ${isFeatured ? 'featured-btn' : ''}" data-tip-id="${tip.id}" data-action="feature">
                            ${isFeatured ? '取消精选' : '设为精选'}
                        </button>
                        <button class="tip-btn" data-tip-id="${tip.id}" data-action="delete" style="color:var(--red);border-color:var(--red);">删除</button>
                    </div>
                </div>
                <div style="font-size:.7rem;color:var(--text-dim);margin-top:.3rem">${dateStr}</div>
            </div>`;
        }).join('');

        // Feature button handlers
        list.querySelectorAll('.tip-btn[data-action="feature"]').forEach(btn => {
            btn.addEventListener('click', async () => {
                const tipId = btn.dataset.tipId;
                const tip = allTips.find(t => t.id === tipId);
                const newFeatured = !tip.featured;
                try {
                    const { error } = await sb.from('tips').update({ featured: newFeatured }).eq('id', tipId);
                    if (error) {
                        // If 'featured' column doesn't exist, try to add it
                        console.warn('Featured column may not exist. Run: ALTER TABLE tips ADD COLUMN featured BOOLEAN DEFAULT false;');
                        return;
                    }
                    tip.featured = newFeatured;
                    renderTips();
                } catch (e) { console.error('Feature tip error:', e); }
            });
        });

        // Delete button handlers
        list.querySelectorAll('.tip-btn[data-action="delete"]').forEach(btn => {
            btn.addEventListener('click', async () => {
                const tipId = btn.dataset.tipId;
                if (!confirm('确定删除这条提示吗？')) return;
                try {
                    const { error } = await sb.from('tips').delete().eq('id', tipId);
                    if (error) throw error;
                    allTips = allTips.filter(t => t.id !== tipId);
                    renderTips();
                } catch (e) {
                    console.error('Delete tip error:', e);
                }
            });
        });
    }

    // ================================================================
    // REAL-TIME SUBSCRIPTIONS
    // ================================================================
    function debouncedReload() {
        if (reloadTimer) clearTimeout(reloadTimer);
        reloadTimer = setTimeout(() => { loadAll(); }, 800);
    }

    function subscribeRealtime() {
        sb.channel('teacher-dashboard')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'self_assessments' }, debouncedReload)
            .on('postgres_changes', { event: '*', schema: 'public', table: 'students' }, debouncedReload)
            .on('postgres_changes', { event: '*', schema: 'public', table: 'daily_progress' }, debouncedReload)
            .on('postgres_changes', { event: '*', schema: 'public', table: 'tips' }, debouncedReload)
            .on('postgres_changes', { event: '*', schema: 'public', table: 'review_plans' }, debouncedReload)
            .subscribe();
    }

    // ================================================================
    // UTILITY
    // ================================================================
    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // === CUSTOM CALENDAR TASK HANDLERS ===
    async function saveCustomTasks() {
        try {
            await sb.from('daily_progress').upsert(
                { day_number: -1, topic: JSON.stringify(customCalendarTasks), status: 'pending', notes: '' },
                { onConflict: 'day_number' }
            );
        } catch(e) { console.error('saveCustomTasks error:', e); }
    }

    document.getElementById('calendarGrid').addEventListener('keydown', async (e) => {
        if (e.key === 'Enter' && e.target.classList.contains('cal-custom-add')) {
            const dateStr = e.target.dataset.date;
            const text = e.target.value.trim();
            if (!text || !dateStr) return;
            customCalendarTasks.push({ date: dateStr, text: text, done: false });
            await saveCustomTasks();
            e.target.value = '';
            renderCalendar();
        }
    });

    document.getElementById('calendarGrid').addEventListener('click', async (e) => {
        // Custom task checkbox
        const chk = e.target.closest('[data-custom-check]');
        if (chk) {
            e.stopPropagation();
            const idx = parseInt(chk.dataset.customCheck);
            if (customCalendarTasks[idx] !== undefined) {
                customCalendarTasks[idx].done = chk.checked;
                await saveCustomTasks();
                const textEl = chk.parentElement.querySelector('[data-custom-text]');
                if (textEl) {
                    textEl.style.textDecoration = chk.checked ? 'line-through' : 'none';
                    textEl.style.opacity = chk.checked ? '0.5' : '1';
                }
            }
            return;
        }
        // Custom task delete
        const del = e.target.closest('[data-custom-del]');
        if (del) {
            e.stopPropagation();
            const idx = parseInt(del.dataset.customDel);
            if (customCalendarTasks[idx] !== undefined) {
                customCalendarTasks.splice(idx, 1);
                await saveCustomTasks();
                renderCalendar();
            }
            return;
        }
        // Custom task text edit
        const txtEl = e.target.closest('[data-custom-text]');
        if (txtEl) {
            e.stopPropagation();
            const idx = parseInt(txtEl.dataset.customText);
            const orig = txtEl.textContent;
            txtEl.setAttribute('contenteditable', 'true');
            txtEl.focus();
            const finishCustomEdit = async () => {
                txtEl.setAttribute('contenteditable', 'false');
                const newText = txtEl.textContent.trim() || orig;
                if (newText !== orig && customCalendarTasks[idx]) {
                    customCalendarTasks[idx].text = newText;
                    await saveCustomTasks();
                }
                txtEl.removeEventListener('blur', finishCustomEdit);
                txtEl.removeEventListener('keydown', handleCustomKey);
            };
            const handleCustomKey = (ev) => {
                if (ev.key === 'Enter') { ev.preventDefault(); txtEl.blur(); }
                if (ev.key === 'Escape') { txtEl.textContent = orig; txtEl.blur(); }
            };
            txtEl.addEventListener('blur', finishCustomEdit);
            txtEl.addEventListener('keydown', handleCustomKey);
            return;
        }
    });

    function parseTopicTasks(raw) {
        if (!raw || !raw.trim()) return [];
        try {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) return parsed;
        } catch (_) {}
        return [{ text: raw.trim(), done: false }];
    }

    function topicTasksToText(tasks) {
        return JSON.stringify(tasks);
    }

    // ================================================================
    // INIT
    // ================================================================
    // If already logged in (session), show app immediately; otherwise show login screen
    if (checkTeacherLogin()) {
        initApp();
    }

    // Inline add task handler (event delegation on calendar grid)
    document.getElementById('calendarGrid').addEventListener('keydown', async (e) => {
        if (e.key === 'Enter' && e.target.classList.contains('cal-inline-add')) {
            e.preventDefault();
            const dayNum = parseInt(e.target.dataset.day);
            const newText = e.target.value.trim();
            if (!newText) return;

            // Find current tasks for this day
            const prog = dailyProgress.find(d => d.day_number === dayNum);
            const currentTopic = (prog && prog.topic) ? prog.topic : (INITIAL_REVIEW_DAYS[dayNum] ? INITIAL_REVIEW_DAYS[dayNum].topic : '');
            const tasks = parseTopicTasks(currentTopic);
            tasks.push({ text: newText, done: false });

            // Save
            const newTopicStr = topicTasksToText(tasks);
            if (prog) {
                prog.topic = newTopicStr;
            } else {
                dailyProgress.push({ day_number: dayNum, topic: newTopicStr, status: 'pending' });
            }
            try {
                await sb.from('daily_progress').upsert(
                    { day_number: dayNum, topic: newTopicStr, status: getStatusForDay(dayNum) },
                    { onConflict: 'day_number' }
                );
            } catch(_) {}

            renderCalendar();
        }
    });
    </script>
    </div><!-- /mainApp -->
